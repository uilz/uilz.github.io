<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stroop 注意力测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #161b22;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            color: #d0d4dc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 24px 12px 60px;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            width: min(720px, 100%);
            background: #1c2128;
            border: 1px solid #2a3038;
            border-radius: 14px;
            padding: 24px 20px 20px;
        }

        h1 {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 2px;
            color: #555c66;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            font-size: 10px;
            color: #3a4048;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .top {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
            gap: 6px;
            margin-bottom: 14px;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #22272e;
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
        }

        .label {
            font-size: 9px;
            color: #484f58;
            letter-spacing: .5px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .value {
            font-size: 20px;
            font-weight: 500;
            color: #8b949e;
            font-variant-numeric: tabular-nums;
            letter-spacing: .5px;
        }

        #wordArea {
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px 0 16px;
            border-radius: 10px;
            background: #21262d;
            border: 1px solid #3a434f;
            cursor: pointer;
            user-select: none;
            transition: border-color .15s;
            position: relative;
        }
        #wordArea:hover {
            border-color: #539bf5;
        }
        #wordArea:active {
            background: #1e2329;
        }

        #stroopWord {
            font-size: 90px;
            font-weight: 700;
            letter-spacing: 6px;
            transition: color .1s;
            /* 默认颜色，停止后恢复 */
            color: #8b949e;
        }

        .feedbackGreen {
            animation: greenFlash .3s ease-out;
        }
        .feedbackRed {
            animation: redFlash .3s ease-out;
        }
        @keyframes greenFlash {
            0% {
                background: #1a3c2a;
            }
            100% {
                background: #21262d;
            }
        }
        @keyframes redFlash {
            0% {
                background: #3c1f1f;
            }
            100% {
                background: #21262d;
            }
        }

        #countdownDisplay {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #e5534b;
            margin: 4px 0 10px;
            display: none;
            letter-spacing: 2px;
        }

        #buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .colorBtn {
            height: 50px;
            border: 1px solid #3a434f;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 1px;
            background: #21262d;
            color: #d0d4dc;
            transition: background .15s, border-color .15s, transform .1s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .colorBtn:hover {
            background: #2a3038;
            border-color: #539bf5;
            transform: translateY(-1px);
        }
        .colorBtn:active {
            transform: scale(.97);
            background: #1c2128;
        }

        #stopBtn {
            display: none;
            width: 100%;
            margin-top: 12px;
            height: 44px;
            border: 1px solid #2a3038;
            border-radius: 8px;
            background: #21262d;
            color: #8b949e;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }
        #stopBtn:hover {
            background: #2a3038;
            border-color: #539bf5;
            color: #c0c7d0;
        }

        #setting {
            margin-top: 18px;
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #22272e;
        }
        #setting h2 {
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #555c66;
            letter-spacing: 1px;
        }
        .checks,
        .mode-select {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            margin-bottom: 10px;
        }
        .checks label,
        .mode-select label {
            display: flex;
            gap: 5px;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
            color: #6e7681;
            user-select: none;
        }
        input[type=checkbox],
        input[type=radio] {
            accent-color: #539bf5;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        #hint {
            margin-top: 14px;
            text-align: center;
            font-size: 11px;
            color: #3a4048;
            letter-spacing: .5px;
            white-space: pre-line;
        }

        #result {
            margin-top: 20px;
            display: none;
            padding: 24px 20px;
            border-radius: 10px;
            background: #21262d;
            border: 1px solid #3a434f;
        }
        #result h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #8b949e;
            letter-spacing: 1px;
            text-align: center;
        }
        #score {
            font-size: 56px;
            font-weight: 700;
            margin: 8px 0;
            text-align: center;
            color: #e6e8ec;
            letter-spacing: 2px;
        }
        #weather,
        #animal {
            font-size: 15px;
            margin-top: 14px;
            line-height: 1.7;
            color: #c0c7d0;
            text-align: center;
        }
        #evaluation {
            margin-top: 16px;
            line-height: 1.8;
            font-size: 13px;
            color: #9099a4;
            white-space: pre-wrap;
            text-align: center;
            border-top: 1px solid #2a3038;
            padding-top: 14px;
        }
        .result-divider {
            margin: 16px 0;
            border: none;
            border-top: 1px solid #2a3038;
        }
        #downloadCSV {
            display: block;
            margin: 18px auto 0;
            padding: 10px 22px;
            font-size: 13px;
            border: 1px solid #3a434f;
            border-radius: 6px;
            cursor: pointer;
            background: #21262d;
            color: #b0b7c0;
            letter-spacing: .5px;
            transition: background .15s, border-color .15s;
        }
        #downloadCSV:hover {
            background: #2a3038;
            border-color: #539bf5;
            color: #e6e8ec;
        }
        #rationale { margin-top: 12px; font-size: 11px; color: #555c66; }
        #rationale summary { cursor: pointer; color: #6e7681; font-size: 12px; }
        .rat-lines { margin-top: 8px; line-height: 1.9; white-space: pre-line; }

        @media(max-width: 600px) {
            body {
                padding: 8px 4px 40px;
            }
            #app {
                padding: 16px 10px 14px;
                border-radius: 8px;
            }
            h1 {
                font-size: 14px;
            }
            #wordArea {
                height: 140px;
            }
            #stroopWord {
                font-size: 64px;
                letter-spacing: 3px;
            }
            .top {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
            }
            .card {
                padding: 6px 2px;
            }
            .value {
                font-size: 16px;
            }
            .label {
                font-size: 8px;
            }
            #buttons {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .colorBtn {
                height: 44px;
                font-size: 15px;
                border-radius: 6px;
            }
            #score {
                font-size: 42px;
            }
            #result {
                padding: 16px 12px;
            }
        }

        @media(max-width: 380px) {
            .top {
                grid-template-columns: repeat(2, 1fr);
            }
            #buttons {
                grid-template-columns: repeat(2, 1fr);
            }
            #stroopWord {
                font-size: 50px;
            }
            #wordArea {
                height: 110px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Stroop</h1>
        <div class="subtitle">注意力冲突测试</div>

        <div class="top">
            <div class="card"><div class="label">耗时</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">正确</div><div id="correct" class="value">0</div></div>
            <div class="card"><div class="label">错误</div><div id="wrong" class="value">0</div></div>
            <div class="card"><div class="label">平均RT</div><div id="avg" class="value">0ms</div></div>
        </div>

        <div id="wordArea">
            <div id="stroopWord">开始</div>
        </div>

        <div id="countdownDisplay">15</div>

        <div id="buttons"></div>

        <button id="stopBtn">停止测试</button>

        <div id="setting">
            <h2>颜色池</h2>
            <div class="checks">
                <label><input checked type="checkbox" value="red">红</label>
                <label><input checked type="checkbox" value="blue">蓝</label>
                <label><input checked type="checkbox" value="green">绿</label>
                <label><input checked type="checkbox" value="yellow">黄</label>
                <label><input checked type="checkbox" value="purple">紫</label>
                <label><input checked type="checkbox" value="white">白</label>
            </div>
            <h2 style="margin-top:12px;">模式</h2>
            <div class="mode-select">
                <label><input type="radio" name="mode" value="free"> 自由模式</label>
                <label><input type="radio" name="mode" value="timed" checked> 15秒挑战</label>
            </div>
            <h2 style="margin-top:12px;">难度</h2>
            <div class="mode-select">
                <label><input type="radio" name="difficulty" value="easy"> 简单</label>
                <label><input type="radio" name="difficulty" value="medium" checked> 中等</label>
                <label><input type="radio" name="difficulty" value="hard"> 困难</label>
            </div>
        </div>

        <div id="hint">空格键 或 点击上方文字区域 开始测试</div>

        <div id="result">
            <h2>注意力报告</h2>
            <div id="score">—</div>
            <div id="weather"></div>
            <div id="animal"></div>
            <div id="evaluation"></div>
            <hr class="result-divider">
            <button id="downloadCSV">导出 CSV 数据</button>
            <details id="rationale"><summary>为什么是这些评价？</summary><div class="rat-lines"></div></details>
        </div>
    </div>

    <script>
        (function() {
            const COLOR_POOL = {
                red: { text: "红", color: "#e5534b" },
                blue: { text: "蓝", color: "#539bf5" },
                green: { text: "绿", color: "#46954a" },
                yellow: { text: "黄", color: "#e5c648" },
                purple: { text: "紫", color: "#986ee2" },
                white: { text: "白", color: "#e8e8e8" }
            };

            let enabledColors = [];
            let currentWord = null,
                currentColor = null;
            let started = false;
            let startTime = 0,
                questionStart = 0;
            let timer = null,
                countdownTimer = null;
            let totalCorrect = 0,
                totalWrong = 0,
                totalQuestions = 0;
            let reactionTimes = [];
            let combo = 0,
                maxCombo = 0;
            let fastestRT = Infinity,
                slowestRT = 0;
            /* 生成评语所需最少题数 */
            const MIN_QUESTIONS = 6;
            let mode = 'timed';
            let difficulty = 'medium';
            let countdownValue = 15;
            const IDLE_HINT = "空格键 或 点击上方文字区域 开始测试\n玩法：上面的颜色，对应下面的字。\n把字当成一幅画，画是什么颜色，你就点写有那个颜色名字的按钮。 玩的时候嘴里跟着念字的颜色（比如念“黄、黄、黄”），能帮你屏蔽掉字义的干扰，多试几次就顺手啦！\n模式：15秒挑战限时15秒、多答多得；自由模式不限时、可随时停止";

            const wordEl = document.getElementById("stroopWord");
            const btnBox = document.getElementById("buttons");
            const wordArea = document.getElementById("wordArea");
            const timeDOM = document.getElementById("time");
            const correctDOM = document.getElementById("correct");
            const wrongDOM = document.getElementById("wrong");
            const avgDOM = document.getElementById("avg");
            const resultPanel = document.getElementById("result");
            const checks = document.querySelectorAll("#setting input[type=checkbox]");
            const modeRadios = document.querySelectorAll("input[name='mode']");
            const difficultyRadios = document.querySelectorAll("input[name='difficulty']");
            const hintEl = document.getElementById("hint");
            const stopBtn = document.getElementById("stopBtn");
            const countdownDisplay = document.getElementById("countdownDisplay");

            /* 添加连击和最快RT卡片 */
            (function addCards() {
                const top = document.querySelector(".top");
                const comboCard = document.createElement("div");
                comboCard.className = "card";
                comboCard.innerHTML = '<div class="label">连击</div><div id="combo" class="value">0</div>';
                top.appendChild(comboCard);
                const bestCard = document.createElement("div");
                bestCard.className = "card";
                bestCard.innerHTML = '<div class="label">最快</div><div id="fastest" class="value">—</div>';
                top.appendChild(bestCard);
            })();

            /* 工具：随机打乱数组 */
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            /* 构建按钮结构（只在颜色池变更时调用） */
            function buildButtons() {
                btnBox.innerHTML = "";
                enabledColors.forEach(key => {
                    const btn = document.createElement("button");
                    btn.className = "colorBtn";
                    btn.dataset.key = key;
                    btn.textContent = COLOR_POOL[key].text;
                    btn.onclick = () => chooseColor(key);
                    btn.addEventListener("keydown", e => {
                        if (e.code === "Space") e.preventDefault();
                    });
                    btnBox.appendChild(btn);
                });
            }

            /* 高性能按钮随机化：仅重排现有DOM节点 */
            function shuffleButtons() {
                if (difficulty === 'easy') return;
                const buttons = Array.from(btnBox.children);
                if (buttons.length === 0) return;
                const shuffled = shuffleArray(buttons);
                const fragment = document.createDocumentFragment();
                shuffled.forEach(btn => fragment.appendChild(btn));
                btnBox.appendChild(fragment);
            }

            /* 按难度应用按钮文字颜色:简单=自身语义色、中等=全部白色、困难=每题从启用色池随机配色 */
            function applyButtonColors() {
                Array.from(btnBox.children).forEach(btn => {
                    let color;
                    if (difficulty === 'easy') {
                        color = COLOR_POOL[btn.dataset.key].color;
                    } else if (difficulty === 'medium') {
                        color = COLOR_POOL.white.color;
                    } else {
                        color = COLOR_POOL[rand(enabledColors)].color;
                    }
                    btn.style.color = color;
                });
            }

            /* 设置持久化：颜色池 × 模式 × 难度 */
            function saveSettings() {
                try {
                    localStorage.setItem('stroop.settings', JSON.stringify({ v: 1, colors: enabledColors, mode: mode, difficulty: difficulty }));
                } catch (e) {}
            }

            function updatePool() {
                enabledColors = [];
                checks.forEach(c => { if (c.checked) enabledColors.push(c.value); });
                if (enabledColors.length < 2) {
                    alert("至少选择两种颜色");
                    return;
                }
                saveSettings();
                buildButtons();
                shuffleButtons();
                applyButtonColors();
            }

            function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
            /* 档内随机取一条文案 */
            function pickText(list) { return list[Math.floor(Math.random() * list.length)]; }

            function nextQuestion() {
                let wordKey = rand(enabledColors);
                let colorKey = rand(enabledColors);
                while (wordKey === colorKey && enabledColors.length > 1) {
                    colorKey = rand(enabledColors);
                }
                currentWord = wordKey;
                currentColor = colorKey;
                wordEl.innerHTML = COLOR_POOL[wordKey].text;
                wordEl.style.color = COLOR_POOL[colorKey].color;
                questionStart = performance.now();
            }

            function updateTimer() {
                const sec = Math.floor((Date.now() - startTime) / 1000);
                const m = Math.floor(sec / 60),
                    s = sec % 60;
                timeDOM.innerHTML = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
            }

            function updateCountdown() {
                countdownValue--;
                countdownDisplay.textContent = countdownValue;
                if (countdownValue <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    stopGame();
                }
            }

            function resetStats() {
                totalCorrect = 0;
                totalWrong = 0;
                totalQuestions = 0;
                reactionTimes = [];
                combo = 0;
                maxCombo = 0;
                fastestRT = Infinity;
                slowestRT = 0;
                correctDOM.innerHTML = 0;
                wrongDOM.innerHTML = 0;
                avgDOM.innerHTML = "0ms";
                const comboEl = document.getElementById("combo");
                const fastestEl = document.getElementById("fastest");
                if (comboEl) comboEl.innerHTML = 0;
                if (fastestEl) fastestEl.innerHTML = "—";
            }

            function clearAllTimers() {
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
            }

            function startGame() {
                try {
                    localStorage.removeItem('stroop.lastRun');
                } catch (e) {}
                started = true;
                resultPanel.style.display = "none";
                resetStats();
                clearAllTimers();
                startTime = Date.now();
                updateTimer();
                timer = setInterval(updateTimer, 100);

                if (mode === 'timed') {
                    countdownValue = 15;
                    countdownDisplay.textContent = countdownValue;
                    countdownDisplay.style.display = "block";
                    countdownTimer = setInterval(updateCountdown, 1000);
                    hintEl.textContent = "倒计时中… 点击停止或按空格提前结束";
                } else {
                    countdownDisplay.style.display = "none";
                    hintEl.textContent = "点击停止按钮、按空格或点击文字区域结束测试";
                }

                stopBtn.style.display = "block";
                wordArea.style.cursor = "pointer";
                nextQuestion();
                shuffleButtons();
                applyButtonColors();
            }

            function stopGame() {
                started = false;
                clearAllTimers();
                // 恢复中心单词为初始状态
                wordEl.innerHTML = "开始";
                wordEl.style.color = "#8b949e";
                // 隐藏倒计时和停止按钮
                countdownDisplay.style.display = "none";
                stopBtn.style.display = "none";
                // 显示结算结果
                showResult();
                hintEl.textContent = IDLE_HINT;
                wordArea.style.cursor = "pointer";
            }

            /* 全局空格键 */
            document.addEventListener("keydown", e => {
                if (e.code !== "Space") return;
                const tag = document.activeElement?.tagName;
                if (tag === "INPUT" || tag === "TEXTAREA") return;
                e.preventDefault();
                if (!started) {
                    startGame();
                } else {
                    stopGame();
                }
            });

            /* 点击文字区域 */
            wordArea.addEventListener("click", () => {
                if (!started) {
                    startGame();
                } else {
                    stopGame();
                }
            });

            /* 停止按钮 */
            stopBtn.addEventListener("click", () => {
                if (started) stopGame();
            });

            function flashGreen() {
                wordArea.classList.remove("feedbackGreen");
                void wordArea.offsetWidth;
                wordArea.classList.add("feedbackGreen");
            }

            function flashRed() {
                wordArea.classList.remove("feedbackRed");
                void wordArea.offsetWidth;
                wordArea.classList.add("feedbackRed");
            }

            function chooseColor(key) {
                if (!started) return;
                const rt = Math.round(performance.now() - questionStart);
                reactionTimes.push(rt);
                totalQuestions++;
                fastestRT = Math.min(fastestRT, rt);
                slowestRT = Math.max(slowestRT, rt);
                const fastestEl = document.getElementById("fastest");
                if (fastestEl) fastestEl.innerHTML = fastestRT === Infinity ? "—" : fastestRT + "ms";

                if (key === currentColor) {
                    totalCorrect++;
                    combo++;
                    maxCombo = Math.max(maxCombo, combo);
                    correctDOM.innerHTML = totalCorrect;
                    const comboEl = document.getElementById("combo");
                    if (comboEl) comboEl.innerHTML = combo;
                    flashGreen();
                } else {
                    totalWrong++;
                    combo = 0;
                    wrongDOM.innerHTML = totalWrong;
                    const comboEl = document.getElementById("combo");
                    if (comboEl) comboEl.innerHTML = 0;
                    flashRed();
                }

                avgDOM.innerHTML =
                    Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length) + "ms";
                nextQuestion();
                shuffleButtons();
                applyButtonColors();
            }

            function getAccuracy() {
                if (totalQuestions === 0) return 0;
                return Math.round(totalCorrect / totalQuestions * 100);
            }

            /* 有效准度：裸正确率的 Wilson 90%置信下界（z=1），小样本自动惩罚 */
            function effectiveAccuracy() {
                if (totalQuestions === 0) return 0;
                const z = 1, n = totalQuestions, p = totalCorrect / n;
                const lb = (p + z * z / (2 * n) - z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n))) / (1 + z * z / n);
                return Math.max(0, lb);
            }

            function calculateScore() {
                const accuracy = Math.round(effectiveAccuracy() * 100);
                const avg = reactionTimes.length ?
                    reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length :
                    1500;
                let score = accuracy - Math.max(0, (avg - 500) / 18) + maxCombo * 0.5;
                // 小样本软惩罚：不足 6 题按比例折算
                if (totalQuestions < MIN_QUESTIONS) score = score * totalQuestions / MIN_QUESTIONS;
                return Math.round(Math.max(0, Math.min(100, score)));
            }

            function saveHistory(score) {
                const bestScore = Math.max(Number(localStorage.bestScore || 0), score);
                /* 小样本按 Wilson 有效准度计入历史 */
                const bestAccuracy = Math.max(Number(localStorage.bestAccuracy || 0), Math.round(effectiveAccuracy() * 100));
                const bestRT = Math.min(Number(localStorage.bestRT || 999999), fastestRT === Infinity ? 999999 :
                    fastestRT);
                localStorage.bestScore = bestScore;
                localStorage.bestAccuracy = bestAccuracy;
                localStorage.bestRT = bestRT;
            }

            function exportCSV(rts) {
                let csv = "ReactionTime(ms)\n";
                const data = rts || reactionTimes;
                data.forEach(rt => csv += rt + "\n");
                const blob = new Blob([csv], { type: "text/csv" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "stroop_data.csv";
                a.click();
            }

            const WEATHER = {
                sun: { name: "晴空", icon: "☀", descs: ["大脑里的天空没有一片多余的云。", "今天云也有，但都飘在你注意力之外。", "你盯颜色的时候，世界自动调成了静音。"], why: "准确率 ≥ 90 且平均RT（反应时）< 600ms" },
                aurora: { name: "极光", icon: "🌌", descs: ["注意力像极光一样安静，却照亮整个夜晚。", "快和准同时发生的时候，天空会亮。", "这一局你的注意力在跳舞，而且每一步都踩在点上。"], why: "得分 > 90 且准确率 ≥ 95" },
                cloud: { name: "多云", icon: "☁", descs: ["偶尔有杂念飘过，但没有停留太久。", "云来了一点，你抬头看了一眼，又继续走。", "注意力偶尔走神，但它总认得回来的路。"], why: "准确率 ≥ 70，未够上更快更高档" },
                fog: { name: "迷雾", icon: "🌫", descs: ["颜色就在眼前，世界却总慢半拍。", "雾不是没有颜色，是你还在和它对表。", "你看见了答案，只是眼神慢了一秒。"], why: "未命中更高档的兜底" },
                storm: { name: "风暴", icon: "⛈", descs: ["文字与颜色不断争吵，注意力疲于奔命。", "今天颜色和字谁也不让谁，你被夹在中间。", "注意力不是没了，是打仗太累了。"], why: "平均RT（反应时）> 900ms" },
                meteor: { name: "流星雨", icon: "☄", descs: ["思维快得像划过夜空，却也容易擦肩而过。", "你的直觉跑得比检查快。", "准度靠速度撑起来的时候，天空会有流星。"], why: "平均RT（反应时）< 550ms 且准确率 ≥ 80" }
            };
            const ANIMAL = {
                hawk: { name: "猎鹰", descs: ["目标出现后，其余世界自动失焦。", "你开始享受连击带来的专注本身了。", "每一击都没有多余动作，像经过训练。"], why: "连击 > 15" },
                owl: { name: "猫头鹰", descs: ["慢一点，但每一次俯冲都精准。", "快不是优点，准才是。", "你在心里先确认了一遍，才让手指投票。"], why: "平均RT < 500ms 且准确率 > 90" },
                wolf: { name: "狼", descs: ["节奏稳定，从不轻易偏离方向。", "你的准确率不是爆发，是维持。", "不冒进、不掉队，这就是狼的走法。"], why: "准确率 ≥ 85" },
                whale: { name: "鲸", descs: ["思维缓慢而深邃，不被噪音左右。", "速度不是你的战场，稳才是。", "你在注意力水下慢慢转身，但从不撞错方向。"], why: "平均RT > 800ms" },
                fox: { name: "狐狸", descs: ["聪明，但偶尔会相信自己的第一直觉。", "你离高分只差“多看一眼”。", "聪明已经在了，耐心也会到账。"], why: "连击 < 5 且准确率 < 70" },
                cat: { name: "猫", descs: ["世界里的每一样东西，都值得看一眼。", "你不是没能力专注，只是好奇心更贵。", "注意力像猫，来了，蹭你一下，走了。"], why: "准确率 < 60" },
                butterfly: { name: "蝴蝶", descs: ["注意力今天停留在每一朵花上。", "每一次犹豫都有原因，只是答案不在犹豫里。", "飞得久了会忘路，下次先落对那朵花。"], why: "各档未命中的兜底" }
            };

            /* 模式 × 难度 × 得分七档判词（与诗句同分界：≥90/75/60/45/30/15/其余） */
            const VERDICT = {
                timed: {
                    easy: {
                        s90: ["模式：15 秒里，你把最安静的模式打成了节拍器。", "模式：限时+简单也要打满才配低调，这一局配了。"],
                        s75: ["模式：15 秒 + 简单 = 手速的体检报告。", "模式：离满速只差一两下犹豫，手指先别踩刹车。"],
                        s60: ["模式：静态题也能失手，开局手还没热。", "模式：及格线上的节拍器，偶尔抢一拍。"],
                        s45: ["模式：15 秒太短，短到状态没来得及上线。", "模式：对半开的一局，时钟不偏不帮。"],
                        s30: ["模式：题目没动、颜色没骗，15 秒输给了手速。", "模式：简单题卡壳，多半是眼睛没跟上手。"],
                        s15: ["模式：简单模式限时翻车——是紧张，不是注意力的锅。", "模式：开局没热收尾没稳，15 秒一晃就没。"],
                        s0: ["模式：静态题垫底——今天不是你的天气。", "模式：关掉页面休息三分钟，比连开十局都管用。"]
                    },
                    medium: {
                        s90: ["模式：字在乱跑，你比它更快，还先到终点。", "模式：乱序限时双开花，你是踩着风跑的。"],
                        s75: ["模式：乱序 + 限时，中等模式被你跑成了直线。", "模式：离顶只隔一两次'再看一眼'。"],
                        s60: ["模式：乱序里丢了准头，但框架没散。", "模式：乱阵里守住及格，眼神开始跟得上字。"],
                        s45: ["模式：时钟没收住你，先收住眼睛。", "模式：一半准一半乱，差的只是稳。"],
                        s30: ["模式：位置一晃，15 秒就不够用了。", "模式：位置一换节奏就断，练的是让眼睛归位。"],
                        s15: ["模式：先回静态题稳住准度，再来挑战时钟？", "模式：15 秒加乱序，这局一直在追自己。"],
                        s0: ["模式：限时+中等还垫底，先回简单找手感。", "模式：乱序不是敌人，抢拍才是。"]
                    },
                    hard: {
                        s90: ["模式：15 秒加困难双重 debuff（减益），你居然没亏。", "模式：困难限时双 debuff（减益）下打满，这句不掺水。"],
                        s75: ["模式：限时和障眼法一起开，你两个都赢了。", "模式：障眼法没挡住你，时钟反成了助攻。"],
                        s60: ["模式：困难局里没崩盘，这就是及格。", "模式：困难里及格就是本事，速度还在爬坡。"],
                        s45: ["模式：困难模式要一局一局喂，15 秒算开胃。", "模式：骗术有三层，你破了两层。"],
                        s30: ["模式：困难模式本来就是用来输的，15 秒更是。", "模式：双重干扰下丢分正常，别开始靠猜。"],
                        s15: ["模式：下次从中等开始攒准度，再回来复仇。", "模式：这局的难点不在颜色，在你没来得及看。"],
                        s0: ["模式：困难限时垫底不亏，这一局本来就是硬仗。", "模式：先把中等跑的 15 秒顺了，再回来填坑。"]
                    }
                },
                free: {
                    hard: {
                        s90: ["模式：困难模式的自由局，每一题都是硬仗。", "模式：困难局打到顶，颜色从今天起认识你。"],
                        s75: ["模式：颜色在按钮上跳了一整局，你都接住了。", "模式：障眼法拆了一半，另一半正在改邪归正。"],
                        s60: ["模式：困难模式输得有章法——先输位置，再输颜色。", "模式：困难模式及格就是真勋章，别催速度。"],
                        s45: ["模式：能撑完全场，就算训练量达标。", "模式：输一半赢一半，困难已经口下留情。"],
                        s30: ["模式：没人掐表，但困难模式自己会施压。", "模式：双层晃眼的时候，先盯字别看色。"],
                        s15: ["模式：这一局的敌人是颜色自己。", "模式：这局欺骗层太厚，回中场歇脚再战。"],
                        s0: ["模式：困难垫底是学费，别交重复的。", "模式：先在中等活下来，再回困难谈感情。"]
                    },
                    easy: {
                        s90: ["模式：不限时的一局，简单模式像散步——你走得很稳。", "模式：不限时还能打满，安静被你变成武器。"],
                        s75: ["模式：慢下来也没偷分，这就是自由模式的诚实。", "模式：散步没踩空，只是终点前慢了几步。"],
                        s60: ["模式：散步也能踩空——状态还在路上。", "模式：状态在线一大半，剩下那半在打盹。"],
                        s45: ["模式：不限时，失误反而更像态度问题。", "模式：题没骗你，你也没赢——平局收场。"],
                        s30: ["模式：题没动、色没骗——纯属状态没上线。", "模式：不限时也丢分，走神开始有名字。"],
                        s15: ["模式：下一局：站起来，深呼吸，再按空格。", "模式：自由模式也能迷路，方向要在眼睛不在手。"],
                        s0: ["模式：静态题垫底——先把呼吸放平再开局。", "模式：每一题多看半秒，这一课简单模式就够。"]
                    },
                    medium: {
                        s90: ["模式：不限时还乱序，你练的是持久专注。", "模式：自由节奏下把乱序理成了直线，罕见。"],
                        s75: ["模式：自己叫停也算一种准度。", "模式：离顶隔着几次'确定一下'。"],
                        s60: ["模式：乱序保住了半局，另一半输给了犹豫。", "模式：乱了脚步没乱节奏，这已经算赢。"],
                        s45: ["模式：慢慢来可以，慢还错就要复盘了。", "模式：一半看清一半抢拍，差的是耐心。"],
                        s30: ["模式：慢慢答也能答错，说明不是时间问题。", "模式：不限时也打滑，乱序得慢慢磨。"],
                        s15: ["模式：把速度先放下，眼睛跟着颜色走一遍。", "模式：慢和错一起来，说明都没进入状态。"],
                        s0: ["模式：先回简单把'看清再点'练熟。", "模式：乱序练眼睛，慢练心，这局两样都欠。"]
                    }
                }
            };

            function pickWeather(score, accuracy, avgRT) {
                if (score > 90 && accuracy >= 95) return WEATHER.aurora;
                if (accuracy >= 90 && avgRT < 600) return WEATHER.sun;
                if (avgRT < 550 && accuracy >= 80) return WEATHER.meteor;
                if (accuracy >= 70) return WEATHER.cloud;
                if (avgRT > 900) return WEATHER.storm;
                return WEATHER.fog;
            }

            function pickAnimal(comboVal, avgRT, accuracy) {
                if (comboVal > 15) return ANIMAL.hawk;
                if (avgRT < 500 && accuracy > 90) return ANIMAL.owl;
                if (accuracy >= 85) return ANIMAL.wolf;
                if (avgRT > 800) return ANIMAL.whale;
                if (comboVal < 5 && accuracy < 70) return ANIMAL.fox;
                if (accuracy < 60) return ANIMAL.cat;
                return ANIMAL.butterfly;
            }

            /* 按得分 15 分一档的 7 档评语（纯 score 瀑布，附档位依据 why） */
            function literaryLine(score, accuracy, comboVal) {
                if (score >= 90) return { line: pickText(["今天，文字试图欺骗你。\n颜色没有说一句话。\n你却相信了颜色。", "连击拉满，天气放晴，\n连失误都只存在于一瞬间。", "这一局没有对手，\n颜色自己举了白旗。"]), why: `本局得分 ${score} ≥ 90，最高段` };
                if (score >= 75) return { line: pickText(["注意力像一把手术刀。\n没有犹豫，没有偏移，\n只有切开真相。", "快和准难得同框，\n你站在正中间。", "注意力像一列准点的车，\n每一站都没有停错。"]), why: `本局得分 ${score} ≥ 75` };
                if (score >= 60) return { line: pickText(["世界一直在制造噪音。\n而你，只回应真正重要的那一个。", "你被带走几次，\n又走回来几次。", "分心收了一点过路费，\n但你没有为它停工。"]), why: `本局得分 ${score} ≥ 60` };
                if (score >= 45) return { line: pickText(["有些文字，今天成功吸引了你的目光。\n但它们终究没有带走你的方向。", "这一局是注意力在找节拍：\n错的都是抢拍的。", "你赢下了大多数回合，\n剩下的只是杂音。"]), why: `本局得分 ${score} ≥ 45` };
                if (score >= 30) return { line: pickText(["这一局错了将近一半。\n它们不是看不见，\n是被字拐跑的。", "注意力已经开始打盹，\n但还没睡沉——\n喊一声，它认得颜色。", "失误扎堆出现的时候，\n眼睛其实还是亮的。"]), why: `本局得分 ${score} ≥ 30` };
                if (score >= 15) return { line: pickText(["颜色一直在那里。\n你只是忙着\n被字的意思带走。", "分数低，不代表不配玩，\n代表这局的你，\n还没进场。", "手指和眼睛今天没商量好，\n每一次点击，\n都晚了半拍。"]), why: `本局得分 ${score} ≥ 15` };
                return { line: pickText(["颜色和文字一直在争论。\n你的注意力站在它们中间，\n一时不知道该相信谁。", "注意力不是丢了，\n是还没出门。", "慢也没关系，\n颜色会等下一次空格。"]), why: `低于 15，兜底段` };
            }

            function showResult() {
                const score = calculateScore();
                saveHistory(score);
                const accuracy = getAccuracy();
                const verdictSet = VERDICT[mode][difficulty];
                const vt = score >= 90 ? 's90' : score >= 75 ? 's75' : score >= 60 ? 's60' : score >= 45 ? 's45' : score >= 30 ? 's30' : score >= 15 ? 's15' : 's0';
                const verdict = pickText(verdictSet[vt]);
                const avgRT = reactionTimes.length ?
                    Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length) :
                    0;
                const w = pickWeather(score, accuracy, avgRT);
                const a = pickAnimal(maxCombo, avgRT, accuracy);
                const poemPick = literaryLine(score, accuracy, maxCombo);
                const diffCN = { easy: '简单', medium: '中等', hard: '困难' }[difficulty];
                const smallSample = totalQuestions < MIN_QUESTIONS ? `样本提示：本局只有 ${totalQuestions} 题，样本偏小，得分已按 ${totalQuestions}/6 折算。\n\n` : '';
                /* 固化本局全部抽中文案，重载后可原样回放 */
                const d = {
                    v: 1,
                    savedAt: Date.now(),
                    score: score,
                    accuracy: accuracy,
                    avgRT: avgRT,
                    fastest: fastestRT === Infinity ? null : fastestRT,
                    slowest: slowestRT,
                    maxCombo: maxCombo,
                    mode: mode,
                    difficulty: difficulty,
                    reactionTimes: [...reactionTimes],
                    wIcon: w.icon,
                    wName: w.name,
                    wDesc: pickText(w.descs),
                    wWhy: w.why,
                    aName: a.name,
                    aDesc: pickText(a.descs),
                    aWhy: a.why,
                    poem: poemPick.line,
                    poemWhy: poemPick.why,
                    verdict: verdict,
                    verdictWhy: `得分 ${score}，${{ s90: '≥90', s75: '≥75', s60: '≥60', s45: '≥45', s30: '≥30', s15: '≥15', s0: '<15' }[vt]} 段；模式 ${mode === 'timed' ? '15秒挑战' : '自由模式'} × 难度 ${diffCN}`,
                    sampleNote: smallSample
                };
                try {
                    localStorage.setItem('stroop.lastRun', JSON.stringify(d));
                } catch (e) {}
                renderReport(d, false);
            }

            /* 渲染结算报告；restored=true 表示快照回放：展示但不滚动定位 */
            function renderReport(d, restored) {
                resultPanel.style.display = "block";
                document.getElementById("score").innerHTML = d.score;
                document.getElementById("weather").innerHTML =
                    `${d.wIcon} 今日注意力天气：<strong>${d.wName}</strong><br><span style="font-size:12px;color:#7a828e;">${d.wDesc}</span>`;
                document.getElementById("animal").innerHTML =
                    `🐾 注意力动物：<strong>${d.aName}</strong><br><span style="font-size:12px;color:#7a828e;">${d.aDesc}</span>`;
                document.getElementById("evaluation").innerHTML =
                    d.poem + "\n\n" + d.verdict + "\n\n" + (d.sampleNote || '') +
                    `准确率 ${d.accuracy}%　·　平均 RT（反应时）${d.avgRT}ms　·　得分 ${d.score}\n` +
                    `最快 ${d.fastest === null ? '—' : d.fastest + 'ms'}　·　最慢 ${d.slowest === 0 ? '—' : d.slowest + 'ms'}　·　最大连击 ${d.maxCombo}\n` +
                    `历史最佳 ${localStorage.bestScore || '—'}`;
                document.querySelector("#rationale .rat-lines").textContent = [
                    `${d.wIcon} ${d.wName} —— ${d.wWhy}｜本局 准确率${d.accuracy}% · 平均RT${d.avgRT}ms · 连击${d.maxCombo} · 得分${d.score}`,
                    `🐾 ${d.aName} —— ${d.aWhy}`,
                    `诗句 —— ${d.poemWhy}`,
                    `${d.verdictWhy}`
                ].join('\n');
                document.getElementById("downloadCSV").onclick = () => exportCSV(d.reactionTimes);
                if (!restored) {
                    setTimeout(() => {
                        resultPanel.scrollIntoView({ behavior: "smooth", block: "center" });
                    }, 120);
                }
            }

            /* 模式切换监听 */
            modeRadios.forEach(radio => {
                radio.addEventListener("change", (e) => {
                    if (e.target.checked) {
                        mode = e.target.value;
                        saveSettings();
                    }
                });
            });

            /* 难度切换监听 */
            difficultyRadios.forEach(radio => {
                radio.addEventListener("change", (e) => {
                    if (e.target.checked) {
                        difficulty = e.target.value;
                        saveSettings();
                        if (!started) {
                            buildButtons();
                            shuffleButtons();
                            applyButtonColors();
                        }
                    }
                });
            });

            /* 恢复设置：非法/缺失一律静默沿用 HTML 默认值 */
            (function restoreSettings() {
                try {
                    const raw = localStorage.getItem('stroop.settings');
                    if (!raw) return;
                    const s = JSON.parse(raw);
                    if (!s || s.v !== 1 || !Array.isArray(s.colors) || s.colors.length < 2 ||
                        !s.colors.every(k => Object.keys(COLOR_POOL).includes(k)) ||
                        !['timed', 'free'].includes(s.mode) || !['easy', 'medium', 'hard'].includes(s.difficulty)) {
                        localStorage.removeItem('stroop.settings');
                        return;
                    }
                    checks.forEach(c => { c.checked = s.colors.includes(c.value); });
                    modeRadios.forEach(r => { r.checked = r.value === s.mode; });
                    difficultyRadios.forEach(r => { r.checked = r.value === s.difficulty; });
                    mode = s.mode;
                    difficulty = s.difficulty;
                } catch (e) {}
            })();

            checks.forEach(c => c.addEventListener("change", updatePool));
            updatePool();

            /* 回放上一局结算快照（存了文案不重抽）；结构不合规则丢弃 */
            (function restoreLastRun() {
                try {
                    const raw = localStorage.getItem('stroop.lastRun');
                    if (!raw) return;
                    let d = null;
                    try {
                        d = JSON.parse(raw);
                    } catch (e2) {
                        localStorage.removeItem('stroop.lastRun');
                        return;
                    }
                    if (!d || d.v !== 1 ||
                        typeof d.score !== 'number' || d.score < 0 || d.score > 100 ||
                        typeof d.avgRT !== 'number' || typeof d.accuracy !== 'number' ||
                        !Array.isArray(d.reactionTimes) ||
                        typeof d.poem !== 'string' || typeof d.verdict !== 'string' || typeof d.wName !== 'string') {
                        localStorage.removeItem('stroop.lastRun');
                        return;
                    }
                    renderReport(d, true);
                } catch (e) {}
            })();

            wordArea.style.cursor = "pointer";
            hintEl.textContent = IDLE_HINT;
        })();
    </script>
