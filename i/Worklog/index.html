<div class="app">

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const uid = () => crypto?.randomUUID?.() || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
const APP='worklog';
const VIEW_MODES={WEEK:'week',DAY:'day'};
const DB_NAME='worklog-v5';
const DB_VER=5;
const OLD_DB_NAME='worklog-v3';
const LEGACY_DB_NAME='worklog-blocks';
const DEFAULT_WS={gran:60,sh:8,eh:20,weekStart:1,startDate:formatDate(new Date(new Date().getFullYear(),0,1))};
const state={timelineWeek:new Date(),timelineDayDate:new Date(),workspaceId:null,search:'',selected:new Set(),editingKey:null,editFiles:[],editNewFiles:[],modalDirty:false,viewMode:VIEW_MODES.WEEK,hideEmptyRows:false,readingMode:false,headerCollapsed:false,headerManual:'none',lastScrollY:window.scrollY||0,lastScrollDirection:0,headerAutoTimer:0,headerScrollLockUntil:0};
// View-state invariants: viewMode is the single global Day/Week state; readingMode and hideEmptyRows are independent presentation preferences.
let db=null,workspaces=[],currentBlocks=[],fileCache=new Map(),searchIndex=[],slots=[],weekDays=[],hitKeys=new Set();
let appSettings={theme:'light',fontSize:'medium',dataVersion:1};
const FONT_SIZE_PRESETS={small:0.94,smallMedium:1.04,medium:1.12,largeMedium:1.20,large:1.30};
const MAX_ATTACHMENT_BYTES=5*1024*1024*1024;
const LEGACY_FONT_MAP={small:'small',large:'medium',xlarge:'large'};

function escapeHTML(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,0,0,0,0)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function startOfWeek(d,ws){const x=startOfDay(d),day=x.getDay();const offset=(day-ws+7)%7;x.setDate(x.getDate()-offset);return x}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=x.getUTCFullYear();const start=new Date(Date.UTC(y,0,1));return Math.ceil((((x-start)/86400000)+1)/7)}
function dayName(i){return ['周日','周一','周二','周三','周四','周五','周六'][i]}
function keyFor(date,time){return `${formatDate(date)}_${time}`}
function slotKeyFromBlock(b){return b.slotKey||b.key?.split('::').pop()||b.key}
function blockDbKey(wsId,slotKey){return `${wsId}::${slotKey}`}
function partsKey(key){const raw=slotKeyFromBlock({key});const i=raw.lastIndexOf('_');return [raw.slice(0,i),raw.slice(i+1)]}
function todayKey(){return formatDate(new Date())}
function isToday(d){return formatDate(d)===todayKey()}
function isSameDate(a,b){return !!a&&!!b&&formatDate(a)===formatDate(b)}
function normalizeTags(v){const raw=Array.isArray(v)?v.join(','):String(v||'');return [...new Set(raw.split(/[,，]/).map(x=>x.trim()).filter(Boolean))].slice(0,30)}
function recordHasContent(b){return !!b&&(!!(b.title||b.body||b.tags?.length||b.prio||b.status||b.loc||b.fileIds?.length||b.startTime||b.endTime))}
function validateWs(w){return [15,30,60].includes(Number(w.gran))&&Number(w.sh)>=0&&Number(w.sh)<24&&Number(w.eh)>Number(w.sh)&&Number(w.eh)<=24&&Number(w.weekStart)>=0&&Number(w.weekStart)<=6&&/^\d{4}-\d{2}-\d{2}$/.test(String(w.startDate||''))}
function currentWs(){return workspaces.find(w=>w.id===state.workspaceId)||workspaces[0]||null}
function workspaceStartDate(){const w=currentWs();return parseDate(w?.startDate||todayKey())}
function isBeforeWorkspaceStart(d){return startOfDay(d)<workspaceStartDate()}
function clampToWorkspaceStart(d){const x=startOfDay(d),min=workspaceStartDate();return x<min?min:x}
function currentWeekStart(){const ws=currentWs()||DEFAULT_WS;const d=clampToWorkspaceStart(state.timelineWeek);return startOfWeek(d,ws.weekStart)}
function currentDayDate(){return clampToWorkspaceStart(state.timelineDayDate)}
function workspaceWeekNumber(date,w=currentWs()){if(!w)return 1;const start=parseDate(w.startDate||todayKey());const anchor=startOfWeek(start,w.weekStart);const target=startOfWeek(clampToWorkspaceStart(date),w.weekStart);const diff=Math.floor((startOfDay(target)-startOfDay(anchor))/86400000);return Math.max(1,Math.floor(diff/7)+1)}
function workspaceWeekAnchor(date,w=currentWs()){if(!w)return startOfWeek(date,1);const start=parseDate(w.startDate||todayKey());const index=workspaceWeekNumber(date,w)-1;return addDays(start,index*7)}
function timeSlots(gran,sh,eh){const out=[];for(let m=sh*60;m<eh*60;m+=gran)out.push(`${pad(Math.floor(m/60))}:${pad(m%60)}`);return out}
function weekLabel(start){const w=currentWs();const n=workspaceWeekNumber(start,w);return `${start.getFullYear()} · 第 ${n} 周`}
function weekSpan(start){const end=addDays(start,6);return `${formatDate(start)} — ${formatDate(end)}`}
function formatBytes(n){if(!n)return '0 B';const u=['B','KB','MB','GB'];const i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),u.length-1);return `${(n/1024**i).toFixed(i?1:0)} ${u[i]}`}
function timeToMinutes(v){const m=/^(\d{1,2}):(\d{2})$/.exec(String(v||''));return m?Number(m[1])*60+Number(m[2]):null}
function minutesToTime(min){min=Math.max(0,Math.min(1439,Number(min)||0));return `${pad(Math.floor(min/60))}:${pad(min%60)}`}
function durationFromTimes(start,end){const s=timeToMinutes(start),e=timeToMinutes(end);if(s===null||e===null)return null;return e>s?e-s:null}
function defaultStartForSlot(dbKey){const raw=slotKeyFromBlock({key:dbKey});const [,time]=partsKey(raw);return time||slots[0]||'08:00'}
function syncDurationFields(source='start'){
  const start=$('#fStart'),duration=$('#fDuration'),end=$('#fEnd'),hint=$('#timeHint');if(!start||!duration||!end)return;
  const sm=timeToMinutes(start.value);if(sm===null)return;
  if(source!=='end'&&duration.value!=='custom'){
    const d=Number(duration.value)||60;end.value=minutesToTime(sm+d);hint.textContent=`预计结束：${end.value}`;return;
  }
  const em=timeToMinutes(end.value);const d=durationFromTimes(start.value,end.value);if(d!==null){
    const preset=[15,30,45,60,90,120,180].find(x=>x===d);duration.value=preset?String(preset):'custom';hint.textContent=`持续 ${d<60?d+' 分钟':`${Math.floor(d/60)}小时${d%60?' '+d%60+'分钟':''}`}`
  }
}
function dataURLToBlob(data){const m=String(data).match(/^data:([^;,]+)?(;base64)?,(.*)$/);if(!m)throw new Error('invalid data URL');const type=m[1]||'application/octet-stream';const bytes=m[2]?Uint8Array.from(atob(m[3]),c=>c.charCodeAt(0)):new TextEncoder().encode(decodeURIComponent(m[3]));return new Blob([bytes],{type})}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

/* ---------- IndexedDB ---------- */
function openDB(){
  if(db)return Promise.resolve(db);
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const d=e.target.result, old=e.oldVersion;
      if(!d.objectStoreNames.contains('workspaces')){
        const ws=d.createObjectStore('workspaces',{keyPath:'id'});ws.createIndex('updatedAt','updatedAt');
      }
      if(!d.objectStoreNames.contains('blocks')){
        const bs=d.createObjectStore('blocks',{keyPath:'key'});bs.createIndex('workspaceId','workspaceId');bs.createIndex('slotKey','slotKey');bs.createIndex('updatedAt','updatedAt');
      }else if(old<4){
        const bs=e.target.transaction.objectStore('blocks');
        if(!bs.indexNames.contains('workspaceId'))bs.createIndex('workspaceId','workspaceId');
        if(!bs.indexNames.contains('slotKey'))bs.createIndex('slotKey','slotKey');
        if(!bs.indexNames.contains('updatedAt'))bs.createIndex('updatedAt','updatedAt');
      }
      if(!d.objectStoreNames.contains('files')){const fs=d.createObjectStore('files',{keyPath:'id'});fs.createIndex('workspaceId','workspaceId');fs.createIndex('updatedAt','updatedAt')}
    };
    req.onsuccess=e=>{db=e.target.result;db.onversionchange=()=>db.close();resolve(db)};
    req.onerror=()=>reject(req.error);
  })
}
function reqP(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function all(store){const d=await openDB();return reqP(d.transaction(store,'readonly').objectStore(store).getAll())}
async function allFileMeta(){const d=await openDB();return new Promise((resolve,reject)=>{const out=[];const r=d.transaction('files','readonly').objectStore('files').openCursor();r.onsuccess=e=>{const c=e.target.result;if(!c)return resolve(out);const v=c.value;out.push({id:v.id,workspaceId:v.workspaceId,name:v.name,type:v.type,size:Number(v.size)||v.blob?.size||0,createdAt:v.createdAt,updatedAt:v.updatedAt,storage:v.storage|| (v.blob?'idb':'opfs'),hasIdbBlob:v.blob instanceof Blob});c.continue()};r.onerror=()=>reject(r.error)})}
async function fileMetaForWorkspace(wsId){const d=await openDB();return new Promise((resolve,reject)=>{const out=[];const store=d.transaction('files','readonly').objectStore('files');const req=store.indexNames.contains('workspaceId')?store.index('workspaceId').openCursor(IDBKeyRange.only(wsId)):store.openCursor();req.onsuccess=e=>{const c=e.target.result;if(!c)return resolve(out);const v=c.value;if(v.workspaceId===wsId)out.push({id:v.id,workspaceId:v.workspaceId,name:v.name,type:v.type,size:Number(v.size)||v.blob?.size||0,createdAt:v.createdAt,updatedAt:v.updatedAt,storage:v.storage|| (v.blob?'idb':'opfs'),hasIdbBlob:v.blob instanceof Blob});c.continue()};req.onerror=()=>reject(req.error)})}
async function deleteWorkspaceFiles(wsId){const metas=await fileMetaForWorkspace(wsId);let failed=0;for(const f of metas){try{await fileStorage.remove(f)}catch{failed++}}if(failed)throw new Error(`有 ${failed} 个附件物理文件未能删除，数据库记录未清除`);for(const f of metas)await remove('files',f.id);return metas.length}
async function put(store,val){const d=await openDB();return reqP(d.transaction(store,'readwrite').objectStore(store).put(val))}
async function remove(store,key){const d=await openDB();return reqP(d.transaction(store,'readwrite').objectStore(store).delete(key))}
async function clear(store){const d=await openDB();return reqP(d.transaction(store,'readwrite').objectStore(store).clear())}

/* ---------- 附件存储：OPFS 主存储 + IndexedDB Blob 兼容后端 ---------- */
const fileStorage=(()=>{
  const OPFS_DIR='.worklog',WORKSPACES_DIR='workspaces';
  let originRootPromise=null,appRootPromise=null,workspaceRootPromise=null,opfsAvailable=null;
  const handleCache=new Map();
  const legacyKey=(workspaceId,fileId)=>`legacy:${workspaceId}/${fileId}`;
  const newKey=(workspaceId,fileId)=>`${workspaceId}/${fileId}`;
  const looksLikeLegacyWorkspaceDir=id=>/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(id)||/^[a-z0-9]+-[a-z0-9]+$/i.test(id);
  async function isOPFSAvailable(){
    if(opfsAvailable!==null)return opfsAvailable;
    if(!window.isSecureContext||location.protocol==='file:'||!navigator.storage||typeof navigator.storage.getDirectory!=='function'){opfsAvailable=false;return false}
    try{
      const r=await originRoot();
      const wd=await r.getDirectoryHandle(OPFS_DIR,{create:true});
      const h=await wd.getFileHandle('.test',{create:true});
      opfsAvailable=typeof h.createWritable==='function';
      try{await wd.removeEntry('.test')}catch{}
    }catch{opfsAvailable=false}
    return opfsAvailable
  }
  async function originRoot(){if(!originRootPromise)originRootPromise=navigator.storage.getDirectory();return originRootPromise}
  async function appRoot(){if(!appRootPromise)appRootPromise=(async()=>{const r=await originRoot();return r.getDirectoryHandle(OPFS_DIR,{create:true})})();return appRootPromise}
  async function workspaceRoot(create=false){if(!workspaceRootPromise)workspaceRootPromise=(async()=>{const a=await appRoot();return a.getDirectoryHandle(WORKSPACES_DIR,{create:true})})();return workspaceRootPromise}
  async function getHandle(workspaceId,fileId,create=false){
    const key=newKey(workspaceId,fileId);if(handleCache.has(key))return handleCache.get(key);
    const r=await workspaceRoot(create);const wd=await r.getDirectoryHandle(String(workspaceId),{create});const h=await wd.getFileHandle(String(fileId),{create});handleCache.set(key,h);return h
  }
  async function getLegacyHandle(workspaceId,fileId){
    const key=legacyKey(workspaceId,fileId);if(handleCache.has(key))return handleCache.get(key);
    const r=await originRoot();const wd=await r.getDirectoryHandle(String(workspaceId),{create:false});const h=await wd.getFileHandle(String(fileId),{create:false});handleCache.set(key,h);return h
  }
  async function write(workspaceId,fileId,blob){
    if(await isOPFSAvailable()){
      const h=await getHandle(workspaceId,fileId,true),w=await h.createWritable();
      try{await blob.stream().pipeTo(w)}catch(e){try{await w.abort()}catch{};throw e}
      const actual=await h.getFile();if(actual.size!==blob.size){try{const wr=await workspaceRoot(false),wd=await wr.getDirectoryHandle(String(workspaceId),{create:false});await removeOne(wd,fileId)}catch{};throw new Error(`附件实际写入大小 ${actual.size} 字节，与源文件 ${blob.size} 字节不一致`)}
      return {storage:'opfs',size:actual.size}
    }
    await put('files',{id:fileId,workspaceId,name:'',type:blob.type||'application/octet-stream',size:blob.size,blob,createdAt:Date.now(),updatedAt:Date.now()});return {storage:'idb',size:blob.size}
  }
  async function read(record){
    if(record?.storage==='opfs'){
      try{return await (await getHandle(record.workspaceId,record.id,false)).getFile()}
      catch(primary){
        try{return await (await getLegacyHandle(record.workspaceId,record.id)).getFile()}
        catch(legacy){if(record.blob)return record.blob;throw primary}
      }
    }
    return record?.blob||null
  }
  async function removeOne(handle,name){try{await handle.removeEntry(String(name));return true}catch(e){if(e?.name==='NotFoundError')return false;throw e}}
  async function removeFile(record){
    if(!record||record.storage!=='opfs')return;
    let removed=false,lastErr=null;
    try{const wr=await workspaceRoot(false);const wd=await wr.getDirectoryHandle(String(record.workspaceId),{create:false});removed=await removeOne(wd,record.id);if(removed)handleCache.delete(newKey(record.workspaceId,record.id));}catch(e){if(e?.name!=='NotFoundError')lastErr=e}
    try{const r=await originRoot(),wd=await r.getDirectoryHandle(String(record.workspaceId),{create:false});const legacyRemoved=await removeOne(wd,record.id);removed=removed||legacyRemoved;if(legacyRemoved)handleCache.delete(legacyKey(record.workspaceId,record.id));}catch(e){if(e?.name!=='NotFoundError')lastErr=lastErr||e}
    if(lastErr)throw lastErr;
    return removed
  }
  async function removeDirIfEmpty(parent,name){try{const d=await parent.getDirectoryHandle(String(name),{create:false});for await(const _ of d.entries())return false;await parent.removeEntry(String(name));return true}catch(e){if(e?.name==='NotFoundError')return false;throw e}}
  async function removeWorkspaceDir(workspaceId){
    let lastErr=null;
    try{const wr=await workspaceRoot(false);await wr.removeEntry(String(workspaceId),{recursive:true})}catch(e){if(e?.name!=='NotFoundError')lastErr=e}
    try{const r=await originRoot();await r.removeEntry(String(workspaceId),{recursive:true})}catch(e){if(e?.name!=='NotFoundError')lastErr=lastErr||e}
    for(const k of [...handleCache.keys()])if(k===String(workspaceId)||k.startsWith(String(workspaceId)+'/')||k.startsWith(`legacy:${workspaceId}/`))handleCache.delete(k)
    if(lastErr)throw lastErr
  }
  async function scanTree(dirHandle,prefix,valid,stats,{remove=false,allowLegacyDir=false}={}){
    const children=[];for await(const [name,h] of dirHandle.entries())children.push([name,h]);
    for(const [name,h] of children){const key=`${prefix}/${name}`;
      if(h.kind==='file'){
        if(!valid.has(key)){
          let size=0;try{size=Number((await h.getFile()).size)||0}catch{}
          stats.orphanFiles++;stats.orphanBytes+=size;
          if(remove){await dirHandle.removeEntry(name);stats.removedFiles++;stats.removedBytes+=size}
        }
      }else if(h.kind==='directory'){
        await scanTree(h,key,valid,stats,{remove,allowLegacyDir});
        if(remove){let empty=true;for await(const _ of h.entries()){empty=false;break}if(empty){await dirHandle.removeEntry(name);stats.removedDirs++}}
      }
    }
  }
  async function inspectOPFS(validRecords=[]){
    if(!(await isOPFSAvailable()))return {available:false,orphanFiles:0,orphanBytes:0,missingFiles:0,dirs:0,cleanableDirs:0,unknownDirs:0,legacyFiles:0,legacyBytes:0};
    const valid=new Set(validRecords.filter(x=>x?.storage==='opfs'&&!x.cleanupPending).map(x=>`${x.workspaceId}/${x.id}`));
    const legacyValid=new Set(validRecords.filter(x=>x?.storage==='opfs'&&!x.cleanupPending).map(x=>`legacy:${x.workspaceId}/${x.id}`));
    const a=await appRoot();const wr=await a.getDirectoryHandle(WORKSPACES_DIR,{create:true});
    const stats={orphanFiles:0,orphanBytes:0,missingFiles:0,dirs:0,cleanableDirs:0,unknownDirs:0,legacyFiles:0,legacyBytes:0};
    for await(const [dirName,dirHandle] of wr.entries()){
      if(dirHandle.kind!=='directory')continue;stats.dirs++;
      const children=[];for await(const [name,h] of dirHandle.entries())children.push([name,h]);
      let childCount=0;for(const [name,h] of children){childCount++;if(h.kind==='file'&&!valid.has(`${dirName}/${name}`)){stats.orphanFiles++;try{stats.orphanBytes+=Number((await h.getFile()).size)||0}catch{}}}
      if(childCount===0)stats.cleanableDirs++;
    }
    const r=await originRoot();
    for await(const [dirName,dirHandle] of r.entries()){
      if(dirHandle.kind!=='directory'||dirName===OPFS_DIR)continue;
      if(!looksLikeLegacyWorkspaceDir(String(dirName)))continue;
      const children=[];for await(const [name,h] of dirHandle.entries())children.push([name,h]);
      for(const [name,h] of children)if(h.kind==='file'&&!legacyValid.has(`legacy:${dirName}/${name}`)){stats.legacyFiles++;try{stats.legacyBytes+=Number((await h.getFile()).size)||0}catch{}}
    }
    for(const rec of validRecords.filter(x=>x?.storage==='opfs')){
      try{await getHandle(rec.workspaceId,rec.id,false)}catch{try{await getLegacyHandle(rec.workspaceId,rec.id)}catch{stats.missingFiles++}}
    }
    stats.orphanFiles+=stats.legacyFiles;stats.orphanBytes+=stats.legacyBytes;
    return {available:true,...stats};
  }
  async function cleanupOrphans(validRecords=[]){
    if(!(await isOPFSAvailable()))return {removedFiles:0,removedBytes:0,removedDirs:0,unknownDirs:0,removedRecordIds:[]};
    const valid=new Set(validRecords.filter(x=>x?.storage==='opfs'&&!x.cleanupPending).map(x=>`${x.workspaceId}/${x.id}`));
    const r=await originRoot(),a=await appRoot(),wr=await workspaceRoot(true);
    const stats={removedFiles:0,removedBytes:0,removedDirs:0,unknownDirs:0};
    for await(const [dirName,dirHandle] of wr.entries()){

/* ---------- 附件/备份完整性约束 ---------- */
const MAX_MANIFEST_BYTES=16*1024*1024;
const MAX_WORKSPACES=10000;
const MAX_BLOCKS=2000000;
const MAX_FILES=100000;
const MAX_ZIP_ENTRIES=MAX_FILES+1;
function assertCount(n,max,label){const v=Number(n)||0;if(v>max)throw new Error(`${label}数量过大：最多 ${max}，实际 ${v}`);return v}
function assertUniqueIds(items,label){const seen=new Set();for(const item of items){const id=String(item?.id||'');if(!id)throw new Error(`${label}缺少唯一 ID`);if(seen.has(id))throw new Error(`${label}存在重复 ID：${id}`);seen.add(id)}return seen}
function validateManifestStructure(m){
  if(m.app!==APP||m.schema<4||!Array.isArray(m.workspaces)||!Array.isArray(m.blocks)||!Array.isArray(m.files))throw new Error('不是有效的 Worklog ZIP 备份');
  assertCount(m.workspaces.length,MAX_WORKSPACES,'工作区');
  assertCount(m.blocks.length,MAX_BLOCKS,'工作块');
  assertCount(m.files.length,MAX_FILES,'附件');
  assertUniqueIds(m.workspaces,'工作区');
  assertUniqueIds(m.files,'附件');
  if(Number(m.schema)>=6&&m.attachmentIdentity&&m.attachmentIdentity!=='uuid-v1')throw new Error('不支持的附件身份方案');
  const wsIds=new Set(m.workspaces.map(w=>String(w.id)));
  const fileIds=new Set(m.files.map(f=>String(f.id)));
  const strictCurrent=Number(m.schema)>=6;

async function importICS(file){
  try{const events=parseICS(await file.text());if(!events.length){notify('ICS 中没有可导入的事件','warn');return}const w=currentWs();const used=new Set(currentBlocks.map(b=>b.slotKey));const existingExternal=new Set(currentBlocks.filter(b=>b.source==='ics'&&b.externalId).map(b=>b.externalId));let created=0,skipped=0;for(const ev of events){if(existingExternal.has(ev.uid)){skipped++;continue}const localStart=ev.start;const startParts=toLocalDateTime(localStart);const slot=findImportSlot(localStart,startParts.time,w,used);used.add(slot);const end=ev.end?toLocalDateTime(ev.end):null;const lines=[];if(ev.description)lines.push(ev.description);if(end)lines.push(`日历时间：${startParts.time}–${end.time}`);if(ev.allDay)lines.push('全天事件');const dbKey=blockDbKey(w.id,slot);await put('blocks',{key:dbKey,slotKey:slot,workspaceId:w.id,title:ev.summary,body:lines.join('\n\n'),tags:['日历'],prio:'',status:'',loc:ev.location,fileIds:[],startTime:startParts.time,endTime:end?.time||'',allDay:ev.allDay,source:'ics',externalId:ev.uid,updatedAt:Date.now(),version:4});created++}await loadCurrentWorkspace();render();notify(`ICS 导入完成：${created} 个事件`)}catch(e){console.error(e);notify('ICS 导入失败：'+(e.message||'格式错误'),'err')}}
function triggerICSImport(){const i=document.createElement('input');i.type='file';i.accept='.ics,text/calendar';i.onchange=e=>e.target.files[0]&&importICS(e.target.files[0]);i.click()}

/* ---------- 周选择器 / 小日历 ---------- */
let calCursor=new Date(),calMode='month';
function positionWeekPopover(){const btn=$('#weekPicker'),pop=$('#weekPopover');if(!btn||!pop||!pop.classList.contains('open'))return;const r=btn.getBoundingClientRect(),width=Math.min(304,window.innerWidth-16),height=Math.min(430,window.innerHeight-16);let left=Math.round(r.left+r.width/2-width/2);left=Math.max(8,Math.min(window.innerWidth-width-8,left));let top=Math.round(r.bottom+8);if(top+height>window.innerHeight-8)top=Math.max(8,Math.round(r.top-height-8));pop.style.width=width+'px';pop.style.maxHeight=height+'px';pop.style.left=left+'px';pop.style.top=top+'px'}
function renderMiniCalendar(){
  const w=currentWs();if(!w)return;
  const year=calCursor.getFullYear(),month=calCursor.getMonth(),root=$('#calContent'),selectedStart=currentWeekStart();
  const yearBtn=$('#calYearBtn'),monthBtn=$('#calMonthBtn');
  yearBtn.textContent=`${year}年`;monthBtn.textContent=`${month+1}月`;
  yearBtn.classList.toggle('active',calMode==='year');monthBtn.classList.toggle('active',calMode==='months' || calMode==='month');
  if(calMode==='year'){
    const center=year,from=center-5,to=center+6;
    let html='<div class="cal-year-scroll"><div class="cal-year-list">';
    for(let y=from;y<=to;y++)html+=`<button class="cal-year-cell${y===year?' current':''}" data-cal-year="${y}">${y}年</button>`;
    html+='</div></div>';root.innerHTML=html;
    root.querySelectorAll('[data-cal-year]').forEach(b=>b.onclick=e=>{e.stopPropagation();calCursor=new Date(Number(b.dataset.calYear),month,1);calMode='months';renderMiniCalendar();positionWeekPopover()});
    $('#calHint').textContent='选择年份后进入 1–12 月';return;
  }
  if(calMode==='months'){
    let html='<div class="cal-grid-12">';
    for(let m=0;m<12;m++){const hasMonth=year>Number(String(w.startDate).slice(0,4))||m>=Number(String(w.startDate).slice(5,7))-1;html+=`<button class="cal-month-cell${m===month?' current':''}" ${hasMonth?'':'disabled'} data-cal-month="${m}">${m+1}月</button>`}
    html+='</div>';root.innerHTML=html;
    root.querySelectorAll('[data-cal-month]').forEach(b=>b.onclick=e=>{e.stopPropagation();calCursor=new Date(year,Number(b.dataset.calMonth),1);calMode='month';renderMiniCalendar();positionWeekPopover()});
    $('#calHint').textContent='选择月份后进入日期小日历';return;
  }
  const monthStart=new Date(year,month,1),gridStart=startOfWeek(monthStart,w.weekStart);
  let html='<div class="cal-weekdays">';for(let i=0;i<7;i++)html+=`<div>${escapeHTML(dayName(addDays(gridStart,i).getDay()).replace('周','')||'日')}</div>`;html+='</div><div class="cal-days">';
  for(let i=0;i<42;i++){const d=addDays(gridStart,i),disabled=isBeforeWorkspaceStart(d),inMonth=d.getMonth()===month,inWeek=startOfWeek(d,w.weekStart).getTime()===selectedStart.getTime(),cls=['cal-day',inMonth?'':'muted',isToday(d)?'today':'',inWeek?'in-week':'',isSameDate(d,selectedStart)?'selected':'',disabled?'disabled':''].filter(Boolean).join(' ');html+=`<button class="${cls}" data-cal-date="${formatDate(d)}" ${disabled?'disabled':''}>${d.getDate()}</button>`}
  root.innerHTML=html+'</div>';
  root.querySelectorAll('[data-cal-date]').forEach(b=>b.onclick=e=>{e.stopPropagation();const d=parseDate(b.dataset.calDate);if(isBeforeWorkspaceStart(d))return;state.selected.clear();if(state.viewMode===VIEW_MODES.DAY){state.timelineDayDate=d}else{state.timelineWeek=d}persistUiPrefs();render();closeWeekPicker()});
  $('#calHint').textContent='点击年份看小年历 · 点击月份看小月历';
}
function openWeekPicker(){const pop=$('#weekPopover');if(pop.parentElement!==document.body)document.body.appendChild(pop);const d=currentWeekStart();calCursor=new Date(d.getFullYear(),d.getMonth(),1);calMode='month';renderMiniCalendar();pop.classList.add('open');$('#weekPicker').setAttribute('aria-expanded','true');requestAnimationFrame(positionWeekPopover)}
function closeWeekPicker(){$('#weekPopover').classList.remove('open');$('#weekPicker').setAttribute('aria-expanded','false')}
$('#weekPicker').onclick=e=>{e.preventDefault();e.stopPropagation();$('#weekPopover').classList.contains('open')?closeWeekPicker():openWeekPicker()};$('#weekPopover').onclick=e=>e.stopPropagation();$('#calYearBtn').onclick=e=>{e.stopPropagation();calMode='year';renderMiniCalendar();positionWeekPopover()};$('#calMonthBtn').onclick=e=>{e.stopPropagation();calMode='months';renderMiniCalendar();positionWeekPopover()};$('#calPrev').onclick=e=>{e.stopPropagation();if(calMode==='year')calCursor=new Date(calCursor.getFullYear()-12,calCursor.getMonth(),1);else if(calMode==='months')calCursor=new Date(calCursor.getFullYear()-1,calCursor.getMonth(),1);else calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);renderMiniCalendar();positionWeekPopover()};$('#calNext').onclick=e=>{e.stopPropagation();if(calMode==='year')calCursor=new Date(calCursor.getFullYear()+12,calCursor.getMonth(),1);else if(calMode==='months')calCursor=new Date(calCursor.getFullYear()+1,calCursor.getMonth(),1);else calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);renderMiniCalendar();positionWeekPopover()};$('#calToday').onclick=e=>{e.stopPropagation();const d=clampToWorkspaceStart(new Date());state.selected.clear();if(state.viewMode===VIEW_MODES.DAY){state.timelineDayDate=d}else{state.timelineWeek=d}persistUiPrefs();render();closeWeekPicker()};document.addEventListener('click',e=>{const pop=$('#weekPopover'),btn=$('#weekPicker');if(pop.classList.contains('open')&&!pop.contains(e.target)&&!btn.contains(e.target))closeWeekPicker()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#weekPopover').classList.contains('open'))closeWeekPicker()});window.addEventListener('resize',()=>{if($('#weekPopover').classList.contains('open'))positionWeekPopover();positionSearchPreview()});

/* ---------- 新建 / 导航 / 搜索 / 设置 ---------- */
function searchableText(b,fmap=fileCache){return [b.title,b.body,b.loc,b.prio,b.status,b.startTime,b.endTime,...(b.tags||[]),...(b.fileIds||[]).map(id=>fmap.get(id)?.name||'')].join(' ').toLocaleLowerCase()}
function matchQuery(b,q,fmap=fileCache){const tokens=q.toLocaleLowerCase().split(/\s+/).filter(Boolean);if(!tokens.length)return true;const text=searchableText(b,fmap);return tokens.every(t=>text.includes(t))}
function positionSearchPreview(){const root=$('#searchPreview'),input=$('#searchInput');if(!root||!input||root.hidden)return;const r=input.getBoundingClientRect();const width=Math.min(760,Math.max(280,window.innerWidth-r.left-12));root.style.left=Math.round(r.left)+'px';root.style.top=Math.round(r.bottom+6)+'px';root.style.width=Math.round(width)+'px'}
function renderSearchPreview(){const root=$('#searchPreview'),q=state.search.trim();if(!q){root.hidden=true;root.classList.remove('open');return}const results=currentBlocks.filter(recordHasContent).filter(b=>matchQuery(b,q)).slice(0,6);root.hidden=false;root.classList.add('open');root.innerHTML=`<div class="search-preview-inner"><div class="preview-head"><span>${results.length?`预览 ${results.length}${results.length===6?'+':''} 条`:'没有找到结果'}</span><button class="preview-more" id="previewMore">更多搜索 <span class="inline-chevron inline-next" aria-hidden="true"></span></button></div><div class="preview-list">${results.map(b=>{const [date,time]=partsKey(b.key);return `<button class="preview-item" data-preview-key="${escapeHTML(b.key)}"><div class="preview-title">${escapeHTML(b.title||'未命名')}</div><div class="preview-meta">${escapeHTML(date)} · ${escapeHTML(time)}${b.body?' · '+escapeHTML(b.body.slice(0,90)):''}</div></button>`}).join('')}</div>${results.length?'':'<div class="search-empty">换一个关键词试试</div>'}</div>`;root.querySelectorAll('[data-preview-key]').forEach(el=>el.onclick=()=>{root.hidden=true;root.classList.remove('open');openEditor(el.dataset.previewKey)});root.querySelector('#previewMore').onclick=()=>openAdvancedSearch(q);positionSearchPreview()}
async function openAdvancedSearch(q=state.search){$('#searchOverlay').classList.add('open');$('#advancedSearchInput').value=q;await renderAdvancedSearch()}
async function renderAdvancedSearch(){const q=$('#advancedSearchInput').value.trim(),scope=$('#searchWorkspace').value,dateScope=$('#searchDateScope').value,root=$('#advancedSearchResults');let rows=[];const d=await openDB();const allBlocks=scope==='all'?await reqP(d.transaction('blocks','readonly').objectStore('blocks').getAll()):currentBlocks;const allFiles=scope==='all'?await allFileMeta(): [...fileCache.values()];const fmap=new Map(allFiles.map(f=>[f.id,f]));rows=allBlocks.filter(recordHasContent).filter(b=>matchQuery(b,q,fmap));
  if(dateScope==='week'){const a=currentWeekStart(),z=addDays(a,6);rows=rows.filter(b=>{const x=parseDate(partsKey(b.key)[0]);return x>=a&&x<=z})}
  if(dateScope==='workspaceStart'){rows=rows.filter(b=>{const ww=workspaces.find(w=>w.id===b.workspaceId);return !ww||parseDate(partsKey(b.key)[0])>=parseDate(ww.startDate||todayKey())})}
  rows.sort((a,b)=>String(b.updatedAt||0).localeCompare(String(a.updatedAt||0)));$('#advancedSearchMeta').textContent=`${rows.length} 条结果`;
  root.innerHTML=rows.length?rows.map(b=>{const [date,time]=partsKey(b.key),ww=workspaces.find(w=>w.id===b.workspaceId);return `<div class="advanced-item" data-advanced-key="${escapeHTML(b.key)}"><div class="advanced-date">${escapeHTML(date)}<br>${escapeHTML(time)}</div><div><div class="advanced-title">${escapeHTML(b.title||'未命名')}</div>${b.body?`<div class="advanced-body">${escapeHTML(b.body.slice(0,240))}</div>`:''}</div><div class="advanced-workspace">${escapeHTML(ww?.name||'')}</div></div>`}).join(''):'<div class="search-empty">没有符合条件的结果</div>';
  root.querySelectorAll('[data-advanced-key]').forEach(el=>el.onclick=async()=>{const key=el.dataset.advancedKey;$('#searchOverlay').classList.remove('open');const found=currentBlocks.find(b=>b.key===key);if(found){openEditor(found.key);return}const [date]=partsKey(key),wid=key.split('::')[0];if(workspaces.some(w=>w.id===wid)){state.workspaceId=wid;state.timelineWeek=parseDate(date);state.timelineDayDate=parseDate(date);persistUiPrefs();await loadCurrentWorkspace();renderWorkspaceSelect();renderWorkspaceForm();render();notify(`已切换到「${currentWs().name}」`)}else notify('找不到该工作区','warn')})}

function newRecord(){const d=state.viewMode===VIEW_MODES.DAY?currentDayDate():currentWeekStart();openEditor(blockDbKey(state.workspaceId,keyFor(d,slots[0]||'08:00')))}
$('#weekViewBtn').onclick=()=>setViewMode(VIEW_MODES.WEEK);$('#dayViewBtn').onclick=()=>setViewMode(VIEW_MODES.DAY);$('#readingModeBtn').onchange=e=>{state.readingMode=!!e.target.checked;persistUiPrefs();render()};$('#hideEmptyRows').onchange=e=>{state.hideEmptyRows=!!e.target.checked;persistUiPrefs();render()};$('#headerToggle').onclick=()=>setHeaderState(!state.headerCollapsed,'manual');window.addEventListener('scroll',handleHeaderScroll,{passive:true});
$('#prevBtn').onclick=()=>{if(state.viewMode===VIEW_MODES.DAY){const n=addDays(state.timelineDayDate||new Date(),-1);if(!isBeforeWorkspaceStart(n))state.timelineDayDate=n}else{state.timelineWeek=clampToWorkspaceStart(addDays(currentWeekStart(),-7));state.selected.clear()}persistUiPrefs();render()};$('#nextBtn').onclick=()=>{if(state.viewMode===VIEW_MODES.DAY){state.timelineDayDate=addDays(state.timelineDayDate||new Date(),1)}else{state.timelineWeek=addDays(currentWeekStart(),7);state.selected.clear()}persistUiPrefs();render()};$('#todayBtn').onclick=()=>{const today=clampToWorkspaceStart(new Date());state.selected.clear();if(state.viewMode===VIEW_MODES.DAY){state.timelineDayDate=today}else{state.timelineWeek=today}persistUiPrefs();render()};

$('#themeBtn').onclick=()=>{appSettings.theme=appSettings.theme==='dark'?'light':'dark';applyTheme();saveAppSettings()};$('#searchClose').onclick=()=>$('#searchOverlay').classList.remove('open');$('#searchOverlay').onclick=e=>{if(e.target.id==='searchOverlay')$('#searchOverlay').classList.remove('open')};$('#advancedSearchInput').oninput=renderAdvancedSearch;$('#searchWorkspace').onchange=renderAdvancedSearch;$('#searchDateScope').onchange=renderAdvancedSearch;$('#advancedSearchClear').onclick=()=>{$('#advancedSearchInput').value='';renderAdvancedSearch();$('#advancedSearchInput').focus()};document.addEventListener('click',e=>{if(!e.target.closest('.searchbox')&&!e.target.closest('#searchPreview')){const r=$('#searchPreview');r.hidden=true;r.classList.remove('open')}});
$('#commandBtn').onclick=()=>$('#commandOverlay').classList.add('open');$('#commandClose').onclick=()=>hideOverlay('#commandOverlay');$('#commandOverlay').onclick=e=>{if(e.target.id==='commandOverlay')hideOverlay('#commandOverlay')};
$$('[data-command]').forEach(b=>b.onclick=()=>{const c=b.dataset.command;hideOverlay('#commandOverlay');if(c==='new')newRecord();if(c==='workspace')$('#workspaceManage').click();if(c==='today'){$('#todayBtn').click()}if(c==='search')$('#searchInput').focus();if(c==='ics')triggerICSImport();if(c==='backupImport')triggerBackupImport();if(c==='export')exportZip();if(c==='clear')clearCurrentWorkspace();if(c==='help')$('#help').hidden=false});
$('#dialogOverlay').onclick=e=>{if(e.target.id==='dialogOverlay')hideOverlay('#dialogOverlay')};$('#workspaceOverlay').onclick=e=>{if(e.target.id==='workspaceOverlay')hideOverlay('#workspaceOverlay')};

document.addEventListener('keydown',e=>{const tag=e.target?.tagName;const editing=['INPUT','TEXTAREA','SELECT'].includes(tag);if(e.key==='Escape'){if($('#dialogOverlay').classList.contains('open')){hideOverlay('#dialogOverlay');return}if($('#editOverlay').classList.contains('open')){closeEditor();return}if($('#commandOverlay').classList.contains('open')){hideOverlay('#commandOverlay');return}if($('#searchOverlay').classList.contains('open')){$('#searchOverlay').classList.remove('open');return}if($('#workspaceOverlay').classList.contains('open')){hideOverlay('#workspaceOverlay');return}if(state.readingMode){state.readingMode=false;persistUiPrefs();render();return}}if(editing)return;if(e.key==='ArrowLeft'){e.preventDefault();$('#prevBtn').click()}else if(e.key==='ArrowRight'){e.preventDefault();$('#nextBtn').click()}else if(e.key.toLowerCase()==='t')$('#todayBtn').click();else if(e.key.toLowerCase()==='n')newRecord();else if(e.key==='/'){e.preventDefault();$('#searchInput').focus()}else if(e.key.toLowerCase()==='w')$('#workspaceManage').click();else if(e.key==='?')$('#help').hidden=!$('#help').hidden;if(e.key.toLowerCase()==='g'){showDialog('跳转到指定日期','输入 YYYY-MM-DD 以定位这一周。',[{text:'取消'},{text:'跳转',primary:true,action:()=>{const v=$('#gotoDateInput')?.value;if(v){const d=clampToWorkspaceStart(parseDate(v));if(state.viewMode===VIEW_MODES.DAY)state.timelineDayDate=d;else state.timelineWeek=d;persistUiPrefs();render()}}}]);const body=$('#dialogBox .modal-body');body.innerHTML='<div class="dialog-text">日期</div><input id="gotoDateInput" type="date" style="width:100%;margin-top:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:9px;padding:9px 10px">';setTimeout(()=>$('#gotoDateInput')?.focus(),20)}});

loadHeaderPrefs();applyHeaderState();
(async()=>{try{await initData();renderWorkspaceSelect();renderWorkspaceForm();$('#weekViewBtn').classList.toggle('active',state.viewMode===VIEW_MODES.WEEK);$('#dayViewBtn').classList.toggle('active',state.viewMode===VIEW_MODES.DAY);$('#hideEmptyRows').checked=!!state.hideEmptyRows;render();notify(`工作日志就绪 · ${currentWs().name}`);const dismissedUntil=Number(localStorage.getItem('worklog:v5:opfsPromptDismissed')||0);if(await fileStorage.isOPFSAvailable()&&await countIdbBlobFiles()&&dismissedUntil<Date.now())setTimeout(()=>{migrateLegacyFilesToOPFS()},600)}catch(e){console.error(e);notify('初始化失败：'+(e.message||'未知错误'),'err')}})();
})();
</script>
