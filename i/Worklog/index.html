<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const uid = () => crypto?.randomUUID?.() || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
const APP='worklog';
const VIEW_MODES={WEEK:'week',DAY:'day'};
const DB_NAME='worklog-v5';
const DB_VER=5;
const OLD_DB_NAME='worklog-v3';
const LEGACY_DB_NAME='worklog-blocks';
const DEFAULT_WS={gran:60,sh:8,eh:20,weekStart:1,startDate:formatDate(new Date())};
const state={week:new Date(),workspaceId:null,search:'',selected:new Set(),editingKey:null,editFiles:[],editNewFiles:[],modalDirty:false,viewMode:VIEW_MODES.WEEK,dayDate:new Date(),hideEmptyRows:false,headerCollapsed:false,headerManual:'none',lastScrollY:window.scrollY||0,lastScrollDirection:0,headerAutoTimer:0,headerScrollLockUntil:0};
let db=null,workspaces=[],currentBlocks=[],fileCache=new Map(),searchIndex=[],slots=[],weekDays=[],hitKeys=new Set();
let appSettings={theme:'light',fontSize:'medium'};
const FONT_SIZE_PRESETS={small:0.94,smallMedium:1.04,medium:1.12,largeMedium:1.20,large:1.30};
const LEGACY_FONT_MAP={small:'small',large:'medium',xlarge:'large'};

function escapeHTML(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,0,0,0,0)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function startOfWeek(d,ws){const x=startOfDay(d),day=x.getDay();const offset=(day-ws+7)%7;x.setDate(x.getDate()-offset);return x}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=x.getUTCFullYear();const start=new Date(Date.UTC(y,0,1));return Math.ceil((((x-start)/86400000)+1)/7)}
function dayName(i){return ['周日','周一','周二','周三','周四','周五','周六'][i]}
function keyFor(date,time){return `${formatDate(date)}_${time}`}
function slotKeyFromBlock(b){return b.slotKey||b.key?.split('::').pop()||b.key}
function blockDbKey(wsId,slotKey){return `${wsId}::${slotKey}`}
function partsKey(key){const raw=slotKeyFromBlock({key});const i=raw.lastIndexOf('_');return [raw.slice(0,i),raw.slice(i+1)]}
function todayKey(){return formatDate(new Date())}
function isToday(d){return formatDate(d)===todayKey()}
function isSameDate(a,b){return !!a&&!!b&&formatDate(a)===formatDate(b)}
function normalizeTags(v){const raw=Array.isArray(v)?v.join(','):String(v||'');return [...new Set(raw.split(/[,，]/).map(x=>x.trim()).filter(Boolean))].slice(0,30)}
function recordHasContent(b){return !!b&&(!!(b.title||b.body||b.tags?.length||b.prio||b.status||b.loc||b.fileIds?.length||b.startTime||b.endTime))}
function validateWs(w){return [15,30,60].includes(Number(w.gran))&&Number(w.sh)>=0&&Number(w.sh)<24&&Number(w.eh)>Number(w.sh)&&Number(w.eh)<=24&&Number(w.weekStart)>=0&&Number(w.weekStart)<=6&&/^\d{4}-\d{2}-\d{2}$/.test(String(w.startDate||''))}
function currentWs(){return workspaces.find(w=>w.id===state.workspaceId)||workspaces[0]||null}
function workspaceStartDate(){const w=currentWs();return parseDate(w?.startDate||todayKey())}
function isBeforeWorkspaceStart(d){return startOfDay(d)<workspaceStartDate()}
function clampToWorkspaceStart(d){const x=startOfDay(d),min=workspaceStartDate();return x<min?min:x}
function currentWeekStart(){const ws=currentWs()||DEFAULT_WS;const d=clampToWorkspaceStart(state.week);return startOfWeek(d,ws.weekStart)}
function workspaceWeekNumber(date,w=currentWs()){if(!w)return 1;const start=parseDate(w.startDate||todayKey());const anchor=startOfWeek(start,w.weekStart);const target=startOfWeek(clampToWorkspaceStart(date),w.weekStart);const diff=Math.floor((startOfDay(target)-startOfDay(anchor))/86400000);return Math.max(1,Math.floor(diff/7)+1)}
function workspaceWeekAnchor(date,w=currentWs()){if(!w)return startOfWeek(date,1);const start=parseDate(w.startDate||todayKey());const index=workspaceWeekNumber(date,w)-1;return addDays(start,index*7)}
function timeSlots(gran,sh,eh){const out=[];for(let m=sh*60;m<eh*60;m+=gran)out.push(`${pad(Math.floor(m/60))}:${pad(m%60)}`);return out}
function weekLabel(start){const w=currentWs();const n=workspaceWeekNumber(start,w);return `${start.getFullYear()} · 第 ${n} 周`}
function weekSpan(start){const end=addDays(start,6);return `${formatDate(start)} — ${formatDate(end)}`}
function formatBytes(n){if(!n)return '0 B';const u=['B','KB','MB','GB'];const i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),u.length-1);return `${(n/1024**i).toFixed(i?1:0)} ${u[i]}`}
function timeToMinutes(v){const m=/^(\d{1,2}):(\d{2})$/.exec(String(v||''));return m?Number(m[1])*60+Number(m[2]):null}
function minutesToTime(min){min=Math.max(0,Math.min(1439,Number(min)||0));return `${pad(Math.floor(min/60))}:${pad(min%60)}`}
function durationFromTimes(start,end){const s=timeToMinutes(start),e=timeToMinutes(end);if(s===null||e===null)return null;return e>s?e-s:null}
function defaultStartForSlot(dbKey){const raw=slotKeyFromBlock({key:dbKey});const [,time]=partsKey(raw);return time||slots[0]||'08:00'}
function syncDurationFields(source='start'){
  const start=$('#fStart'),duration=$('#fDuration'),end=$('#fEnd'),hint=$('#timeHint');if(!start||!duration||!end)return;
  const sm=timeToMinutes(start.value);if(sm===null)return;
  if(source!=='end'&&duration.value!=='custom'){
    const d=Number(duration.value)||60;end.value=minutesToTime(sm+d);hint.textContent=`预计结束：${end.value}`;return;
  }
  const em=timeToMinutes(end.value);const d=durationFromTimes(start.value,end.value);if(d!==null){
    const preset=[15,30,45,60,90,120,180].find(x=>x===d);duration.value=preset?String(preset):'custom';hint.textContent=`持续 ${d<60?d+' 分钟':`${Math.floor(d/60)}小时${d%60?' '+d%60+'分钟':''}`}`
  }
}
function dataURLToBlob(data){const m=String(data).match(/^data:([^;,]+)?(;base64)?,(.*)$/);if(!m)throw new Error('invalid data URL');const type=m[1]||'application/octet-stream';const bytes=m[2]?Uint8Array.from(atob(m[3]),c=>c.charCodeAt(0)):new TextEncoder().encode(decodeURIComponent(m[3]));return new Blob([bytes],{type})}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

/* ---------- IndexedDB ---------- */
function openDB(){
  if(db)return Promise.resolve(db);
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const d=e.target.result, old=e.oldVersion;
      if(!d.objectStoreNames.contains('workspaces')){
        const ws=d.createObjectStore('workspaces',{keyPath:'id'});ws.createIndex('updatedAt','updatedAt');
      }
      if(!d.objectStoreNames.contains('blocks')){
        const bs=d.createObjectStore('blocks',{keyPath:'key'});bs.createIndex('workspaceId','workspaceId');bs.createIndex('slotKey','slotKey');bs.createIndex('updatedAt','updatedAt');
      }else if(old<4){
        const bs=e.target.transaction.objectStore('blocks');
        if(!bs.indexNames.contains('workspaceId'))bs.createIndex('workspaceId','workspaceId');
        if(!bs.indexNames.contains('slotKey'))bs.createIndex('slotKey','slotKey');
        if(!bs.indexNames.contains('updatedAt'))bs.createIndex('updatedAt','updatedAt');
      }
      if(!d.objectStoreNames.contains('files')){const fs=d.createObjectStore('files',{keyPath:'id'});fs.createIndex('workspaceId','workspaceId');fs.createIndex('updatedAt','updatedAt')}
    };
    req.onsuccess=e=>{db=e.target.result;db.onversionchange=()=>db.close();resolve(db)};
    req.onerror=()=>reject(req.error);
  })
}
function reqP(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function all(store){const d=await openDB();return reqP(d.transaction(store,'readonly').objectStore(store).getAll())}
async function allFileMeta(){const d=await openDB();return new Promise((resolve,reject)=>{const out=[];const r=d.transaction('files','readonly').objectStore('files').openCursor();r.onsuccess=e=>{const c=e.target.result;if(!c)return resolve(out);const v=c.value;out.push({id:v.id,workspaceId:v.workspaceId,name:v.name,type:v.type,size:Number(v.size)||v.blob?.size||0,createdAt:v.createdAt,updatedAt:v.updatedAt});c.continue()};r.onerror=()=>reject(r.error)})}
async function getFile(id){const d=await openDB();return reqP(d.transaction('files','readonly').objectStore('files').get(id))}
async function fileMetaForWorkspace(wsId){const d=await openDB();return new Promise((resolve,reject)=>{const out=[];const store=d.transaction('files','readonly').objectStore('files');const req=store.indexNames.contains('workspaceId')?store.index('workspaceId').openCursor(IDBKeyRange.only(wsId)):store.openCursor();req.onsuccess=e=>{const c=e.target.result;if(!c)return resolve(out);const v=c.value;if(v.workspaceId===wsId)out.push({id:v.id,workspaceId:v.workspaceId,name:v.name,type:v.type,size:Number(v.size)||v.blob?.size||0,createdAt:v.createdAt,updatedAt:v.updatedAt});c.continue()};req.onerror=()=>reject(req.error)})}
async function put(store,val){const d=await openDB();return reqP(d.transaction(store,'readwrite').objectStore(store).put(val))}
async function remove(store,key){const d=await openDB();return reqP(d.transaction(store,'readwrite').objectStore(store).delete(key))}
async function clear(store){const d=await openDB();return reqP(d.transaction(store,'readwrite').objectStore(store).clear())}
async function replaceStores(data){
  const d=await openDB();
  await new Promise((resolve,reject)=>{
    const t=d.transaction(['workspaces','blocks','files'],'readwrite');
    t.objectStore('workspaces').clear();t.objectStore('blocks').clear();t.objectStore('files').clear();
    for(const w of data.workspaces)t.objectStore('workspaces').put(w);
    for(const b of data.blocks)t.objectStore('blocks').put(b);
    for(const f of data.files)t.objectStore('files').put(f);
    t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);
  });
}

async function ensureDefaultWorkspace(){

async function importLegacyDB(name){
  if(!indexedDB.databases)return 0;
  const list=await indexedDB.databases();if(!list.some(x=>x.name===name))return 0;
  let legacy;try{legacy=await new Promise((res,rej)=>{const r=indexedDB.open(name);r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error)})}catch{return 0}

  let legacyFiles=[];
  if(legacy.objectStoreNames.contains('files')){
    try{legacyFiles=await new Promise((res,rej)=>{const r=legacy.transaction('files','readonly').objectStore('files').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}catch{}
  }

    let legacyCfg={};try{legacyCfg=JSON.parse(localStorage.getItem('worklog:v3:cfg')||localStorage.getItem('worklog_cfg')||'{}')||{}}catch{}
    const ws={id:uid(),name:'默认工作区',createdAt:Date.now(),updatedAt:Date.now(),gran:Number(legacyCfg.gran)||60,sh:Number(legacyCfg.sh??8),eh:Number(legacyCfg.eh??20),weekStart:Number(legacyCfg.weekStart??legacyCfg.ws??1),startDate:String(legacyCfg.startDate||formatDate(new Date()))};
    if(!validateWs(ws))Object.assign(ws,DEFAULT_WS);
    await put('workspaces',ws);workspaces=[ws];
  }
  const ws=currentWs();
  const copiedFileIds=new Map();
  for(const f of legacyFiles){
    if(!f?.id)continue;
    try{
      let blob=f.blob;
      if(!(blob instanceof Blob)&&f.data)blob=dataURLToBlob(f.data);
      if(!blob)continue;
      const id=f.id;
      const rec={id,workspaceId:ws.id,name:f.name||'附件',type:f.type||blob.type||'application/octet-stream',size:Number(f.size)||blob.size,blob,createdAt:f.createdAt||Date.now(),updatedAt:f.updatedAt||Date.now()};
      await put('files',rec);copiedFileIds.set(String(f.id),id);
    }catch{}
  }
  let count=0;
  for(const raw of items){
    if(!raw?.key)continue;
    const slot=raw.slotKey||(raw.key.includes('::')?raw.key.split('::').pop():raw.key);
    const fileIds=[];
    if(Array.isArray(raw.fileIds))for(const fid of raw.fileIds){const id=copiedFileIds.get(String(fid));if(id)fileIds.push(id)}
    for(const f of (raw.files||[])){
      if(!f?.data)continue;
      const id=uid();const blob=dataURLToBlob(f.data);const rec={id,workspaceId:ws.id,name:f.name||'附件',type:f.type||blob.type,size:Number(f.size)||blob.size,blob,createdAt:Date.now(),updatedAt:Date.now()};await put('files',rec);fileIds.push(id)
    }
    await put('blocks',{key:blockDbKey(ws.id,slot),slotKey:slot,workspaceId:ws.id,title:String(raw.title||''),body:String(raw.body||''),tags:normalizeTags(raw.tags),prio:raw.prio||'',status:raw.status||'',loc:String(raw.loc||''),fileIds:[...new Set(fileIds)],updatedAt:Number(raw.updatedAt)||Date.now(),version:4});count++;
  }
  return count;
}

function getBlockInterval(b,w){
  const raw=slotKeyFromBlock(b),[date,slotTime]=partsKey(raw);
  const start=timeToMinutes(b.startTime||slotTime);
  const endRaw=timeToMinutes(b.endTime);
  const end=endRaw===null?Math.min((start??0)+(w.gran||60),w.eh*60):endRaw;
  return {date,start,end};
}
function blocksCoveringSlot(blocks,w,date,slotTime){
  const m=timeToMinutes(slotTime);
  return blocks.filter(b=>recordHasContent(b)).filter(b=>{
    const x=getBlockInterval(b,w);return x.date===formatDate(date)&&x.start!==null&&m!==null&&m>=x.start&&m<x.end;
  }).sort((a,b)=>(timeToMinutes(a.startTime)||0)-(timeToMinutes(b.startTime)||0)||(a.updatedAt||0)-(b.updatedAt||0));
}
function visibleSlotIndexesForRecords(records,w,slotList){
  if(!state.hideEmptyRows) return slotList.map((_,i)=>i);
  const out=[];
  for(let i=0;i<slotList.length;i++){
    const slotMin=timeToMinutes(slotList[i]);
    const covered=records.some(b=>{
      const x=getBlockInterval(b,w);
      return x.start!==null&&x.end>x.start&&slotMin!==null&&x.start<slotMin+w.gran&&x.end>slotMin;
    });
    if(covered)out.push(i);
  }
  return out;
}
function visualOffset(minute,w,visibleIndices,slotList){
  if(!visibleIndices.length)return 0;
  const grid=Math.max(0,(minute-w.sh*60)/w.gran),base=Math.floor(grid),frac=grid-base;
  const p=visibleIndices.indexOf(base);
  if(p>=0)return p+frac;
  let count=0;while(count<visibleIndices.length&&visibleIndices[count]<base)count++;
  return count;
}

$('#weekPicker').onclick=e=>{e.preventDefault();e.stopPropagation();$('#weekPopover').classList.contains('open')?closeWeekPicker():openWeekPicker()};$('#weekPopover').onclick=e=>e.stopPropagation();$('#calYearBtn').onclick=e=>{e.stopPropagation();calMode='year';renderMiniCalendar();positionWeekPopover()};$('#calMonthBtn').onclick=e=>{e.stopPropagation();calMode='months';renderMiniCalendar();positionWeekPopover()};$('#calPrev').onclick=e=>{e.stopPropagation();if(calMode==='year')calCursor=new Date(calCursor.getFullYear()-12,calCursor.getMonth(),1);else if(calMode==='months')calCursor=new Date(calCursor.getFullYear()-1,calCursor.getMonth(),1);else calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);renderMiniCalendar();positionWeekPopover()};$('#calNext').onclick=e=>{e.stopPropagation();if(calMode==='year')calCursor=new Date(calCursor.getFullYear()+12,calCursor.getMonth(),1);else if(calMode==='months')calCursor=new Date(calCursor.getFullYear()+1,calCursor.getMonth(),1);else calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);renderMiniCalendar();positionWeekPopover()};$('#calToday').onclick=e=>{e.stopPropagation();const d=clampToWorkspaceStart(new Date());state.week=d;state.dayDate=d;state.viewMode=VIEW_MODES.WEEK;persistUiPrefs();render();closeWeekPicker()};document.addEventListener('click',e=>{const pop=$('#weekPopover'),btn=$('#weekPicker');if(pop.classList.contains('open')&&!pop.contains(e.target)&&!btn.contains(e.target))closeWeekPicker()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#weekPopover').classList.contains('open'))closeWeekPicker()});window.addEventListener('resize',()=>{if($('#weekPopover').classList.contains('open'))positionWeekPopover();positionSearchPreview()});

/* ---------- 新建 / 导航 / 搜索 / 设置 ---------- */
function searchableText(b,fmap=fileCache){return [b.title,b.body,b.loc,b.prio,b.status,b.startTime,b.endTime,...(b.tags||[]),...(b.fileIds||[]).map(id=>fmap.get(id)?.name||'')].join(' ').toLocaleLowerCase()}
function matchQuery(b,q,fmap=fileCache){const tokens=q.toLocaleLowerCase().split(/\s+/).filter(Boolean);if(!tokens.length)return true;const text=searchableText(b,fmap);return tokens.every(t=>text.includes(t))}
function positionSearchPreview(){const root=$('#searchPreview'),input=$('#searchInput');if(!root||!input||root.hidden)return;const r=input.getBoundingClientRect();const width=Math.min(760,Math.max(280,window.innerWidth-r.left-12));root.style.left=Math.round(r.left)+'px';root.style.top=Math.round(r.bottom+6)+'px';root.style.width=Math.round(width)+'px'}
function renderSearchPreview(){const root=$('#searchPreview'),q=state.search.trim();if(!q){root.hidden=true;root.classList.remove('open');return}const results=currentBlocks.filter(recordHasContent).filter(b=>matchQuery(b,q)).slice(0,6);root.hidden=false;root.classList.add('open');root.innerHTML=`<div class="search-preview-inner"><div class="preview-head"><span>${results.length?`预览 ${results.length}${results.length===6?'+':''} 条`:'没有找到结果'}</span><button class="preview-more" id="previewMore">更多搜索 <span class="inline-chevron inline-next" aria-hidden="true"></span></button></div><div class="preview-list">${results.map(b=>{const [date,time]=partsKey(b.key);return `<button class="preview-item" data-preview-key="${escapeHTML(b.key)}"><div class="preview-title">${escapeHTML(b.title||'未命名')}</div><div class="preview-meta">${escapeHTML(date)} · ${escapeHTML(time)}${b.body?' · '+escapeHTML(b.body.slice(0,90)):''}</div></button>`}).join('')}</div>${results.length?'':'<div class="search-empty">换一个关键词试试</div>'}</div>`;root.querySelectorAll('[data-preview-key]').forEach(el=>el.onclick=()=>{root.hidden=true;root.classList.remove('open');openEditor(el.dataset.previewKey)});root.querySelector('#previewMore').onclick=()=>openAdvancedSearch(q);positionSearchPreview()}
async function openAdvancedSearch(q=state.search){$('#searchOverlay').classList.add('open');$('#advancedSearchInput').value=q;await renderAdvancedSearch()}
async function renderAdvancedSearch(){const q=$('#advancedSearchInput').value.trim(),scope=$('#searchWorkspace').value,dateScope=$('#searchDateScope').value,root=$('#advancedSearchResults');let rows=[];const d=await openDB();const allBlocks=scope==='all'?await reqP(d.transaction('blocks','readonly').objectStore('blocks').getAll()):currentBlocks;const allFiles=scope==='all'?await allFileMeta(): [...fileCache.values()];const fmap=new Map(allFiles.map(f=>[f.id,f]));rows=allBlocks.filter(recordHasContent).filter(b=>matchQuery(b,q,fmap));
  if(dateScope==='week'){const a=currentWeekStart(),z=addDays(a,6);rows=rows.filter(b=>{const x=parseDate(partsKey(b.key)[0]);return x>=a&&x<=z})}
  if(dateScope==='workspaceStart'){rows=rows.filter(b=>{const ww=workspaces.find(w=>w.id===b.workspaceId);return !ww||parseDate(partsKey(b.key)[0])>=parseDate(ww.startDate||todayKey())})}
  rows.sort((a,b)=>String(b.updatedAt||0).localeCompare(String(a.updatedAt||0)));$('#advancedSearchMeta').textContent=`${rows.length} 条结果`;
  root.innerHTML=rows.length?rows.map(b=>{const [date,time]=partsKey(b.key),ww=workspaces.find(w=>w.id===b.workspaceId);return `<div class="advanced-item" data-advanced-key="${escapeHTML(b.key)}"><div class="advanced-date">${escapeHTML(date)}<br>${escapeHTML(time)}</div><div><div class="advanced-title">${escapeHTML(b.title||'未命名')}</div>${b.body?`<div class="advanced-body">${escapeHTML(b.body.slice(0,240))}</div>`:''}</div><div class="advanced-workspace">${escapeHTML(ww?.name||'')}</div></div>`}).join(''):'<div class="search-empty">没有符合条件的结果</div>';
  root.querySelectorAll('[data-advanced-key]').forEach(el=>el.onclick=async()=>{const key=el.dataset.advancedKey;$('#searchOverlay').classList.remove('open');const found=currentBlocks.find(b=>b.key===key);if(found){openEditor(found.key);return}const [date]=partsKey(key),wid=key.split('::')[0];if(workspaces.some(w=>w.id===wid)){state.workspaceId=wid;state.week=parseDate(date);state.dayDate=parseDate(date);persistUiPrefs();await loadCurrentWorkspace();renderWorkspaceSelect();renderWorkspaceForm();render();notify(`已切换到「${currentWs().name}」`)}else notify('找不到该工作区','warn')})}

function newRecord(){const d=currentWeekStart();openEditor(blockDbKey(state.workspaceId,keyFor(d,slots[0]||'08:00')))}
$('#weekViewBtn').onclick=()=>setViewMode(VIEW_MODES.WEEK);$('#dayViewBtn').onclick=()=>setViewMode(VIEW_MODES.DAY);$('#hideEmptyRows').onchange=e=>{state.hideEmptyRows=!!e.target.checked;persistUiPrefs();render()};$('#headerToggle').onclick=()=>setHeaderState(!state.headerCollapsed,'manual');window.addEventListener('scroll',handleHeaderScroll,{passive:true});
$('#prevBtn').onclick=()=>{if(state.viewMode===VIEW_MODES.DAY){state.dayDate=clampToWorkspaceStart(addDays(state.dayDate||new Date(),-1));state.week=state.dayDate;persistUiPrefs();render()}else{state.week=clampToWorkspaceStart(addDays(currentWeekStart(),-7));state.selected.clear();persistUiPrefs();render()}};$('#nextBtn').onclick=()=>{if(state.viewMode===VIEW_MODES.DAY){state.dayDate=addDays(state.dayDate||new Date(),1);state.week=state.dayDate;persistUiPrefs();render()}else{state.week=addDays(currentWeekStart(),7);state.selected.clear();persistUiPrefs();render()}};$('#todayBtn').onclick=()=>{const today=clampToWorkspaceStart(new Date());state.week=today;state.dayDate=today;state.selected.clear();persistUiPrefs();render()};
$('#searchInput').oninput=e=>{state.search=e.target.value.trim();$('#clearSearch').style.visibility=state.search?'visible':'hidden';render();renderSearchPreview()};$('#clearSearch').onclick=()=>{$('#searchInput').value='';state.search='';$('#clearSearch').style.visibility='hidden';render();renderSearchPreview();$('#searchInput').focus()};$('#clearSearch').style.visibility='hidden';

$('#themeBtn').onclick=()=>{appSettings.theme=appSettings.theme==='dark'?'light':'dark';applyTheme();saveAppSettings()};$('#searchClose').onclick=()=>$('#searchOverlay').classList.remove('open');$('#searchOverlay').onclick=e=>{if(e.target.id==='searchOverlay')$('#searchOverlay').classList.remove('open')};$('#advancedSearchInput').oninput=renderAdvancedSearch;$('#searchWorkspace').onchange=renderAdvancedSearch;$('#searchDateScope').onchange=renderAdvancedSearch;$('#advancedSearchClear').onclick=()=>{$('#advancedSearchInput').value='';renderAdvancedSearch();$('#advancedSearchInput').focus()};document.addEventListener('click',e=>{if(!e.target.closest('.searchbox')&&!e.target.closest('#searchPreview')){const r=$('#searchPreview');r.hidden=true;r.classList.remove('open')}});
$('#commandBtn').onclick=()=>$('#commandOverlay').classList.add('open');$('#commandClose').onclick=()=>hideOverlay('#commandOverlay');$('#commandOverlay').onclick=e=>{if(e.target.id==='commandOverlay')hideOverlay('#commandOverlay')};
$$('[data-command]').forEach(b=>b.onclick=()=>{const c=b.dataset.command;hideOverlay('#commandOverlay');if(c==='new')newRecord();if(c==='workspace')$('#workspaceManage').click();if(c==='today'){$('#todayBtn').click()}if(c==='search')$('#searchInput').focus();if(c==='ics')triggerICSImport();if(c==='backupImport')triggerBackupImport();if(c==='export')exportZip();if(c==='clear')clearCurrentWorkspace();if(c==='help')$('#help').hidden=false});
$('#dialogOverlay').onclick=e=>{if(e.target.id==='dialogOverlay')hideOverlay('#dialogOverlay')};$('#workspaceOverlay').onclick=e=>{if(e.target.id==='workspaceOverlay')hideOverlay('#workspaceOverlay')};

document.addEventListener('keydown',e=>{const tag=e.target?.tagName;const editing=['INPUT','TEXTAREA','SELECT'].includes(tag);if(e.key==='Escape'){if($('#dialogOverlay').classList.contains('open')){hideOverlay('#dialogOverlay');return}if($('#editOverlay').classList.contains('open')){closeEditor();return}if($('#commandOverlay').classList.contains('open')){hideOverlay('#commandOverlay');return}if($('#searchOverlay').classList.contains('open')){$('#searchOverlay').classList.remove('open');return}if($('#workspaceOverlay').classList.contains('open')){hideOverlay('#workspaceOverlay');return}}if(editing)return;if(e.key==='ArrowLeft'){e.preventDefault();$('#prevBtn').click()}else if(e.key==='ArrowRight'){e.preventDefault();$('#nextBtn').click()}else if(e.key.toLowerCase()==='t')$('#todayBtn').click();else if(e.key.toLowerCase()==='n')newRecord();else if(e.key==='/'){e.preventDefault();$('#searchInput').focus()}else if(e.key.toLowerCase()==='w')$('#workspaceManage').click();else if(e.key==='?')$('#help').hidden=!$('#help').hidden;else if(e.key.toLowerCase()==='g'){showDialog('跳转到指定日期','输入 YYYY-MM-DD 以定位这一周。',[{text:'取消'},{text:'跳转',primary:true,action:()=>{const v=$('#dialogInput')?.value;if(v){state.week=clampToWorkspaceStart(parseDate(v));state.dayDate=state.week;persistUiPrefs();render()}}}]);const body=$('#dialogBox .modal-body');body.innerHTML='<div class="dialog-text">日期</div><input id="dialogInput" type="date" style="width:100%;margin-top:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:9px;padding:9px 10px">';setTimeout(()=>$('#dialogInput')?.focus(),20)}});


loadHeaderPrefs();applyHeaderState();
(async()=>{try{await initData();renderWorkspaceSelect();renderWorkspaceForm();$('#weekViewBtn').classList.toggle('active',state.viewMode===VIEW_MODES.WEEK);$('#dayViewBtn').classList.toggle('active',state.viewMode===VIEW_MODES.DAY);$('#hideEmptyRows').checked=!!state.hideEmptyRows;render();notify(`工作日志就绪 · ${currentWs().name}`)}catch(e){console.error(e);notify('初始化失败：'+(e.message||'未知错误'),'err')}})();
})();
</script>
